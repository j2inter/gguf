name: "📦 Pip Extreme Pro: Windows Python 3.12 Relay"

on:
  workflow_dispatch:
    inputs:
      pip_command:
        description: '完整的 pip download 命令'
        required: true
        default: 'pip download requests'
      chunk_size_mb:
        description: '7z 分卷大小(MB)'
        required: true
        default: '2000'

jobs:
  pip-relay:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 💻 [1/8] 硬件掃描與 Python 3.12 環境核查
        run: |
          Write-Host "==== [SYSTEM INFO START] ===="
          $info = Get-ComputerInfo
          Write-Host "🪟 OS: $($info.OsName)"
          Write-Host "🧠 CPU: $env:PROCESSOR_IDENTIFIER ($env:NUMBER_OF_PROCESSORS Cores)"
          python --version
          Get-PSDrive C | Select-Object Name, @{Name="Free(GB)";Expression={"{0:N2}" -f ($_.Free/1GB)}}
          Write-Host "==== [SYSTEM INFO END] ===="

      - name: 🐍 [2/8] 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ [3/8] 工具鏈核查 (7-Zip)
        run: |
          # windows-latest runner image 已預裝 C:\Program Files\7-Zip\7z.exe，
          # 之前跑 choco install 7zip 是浪費 20-40 秒並可能因 choco 源抖動失敗。
          $sz = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sz)) { throw "7z.exe 不在預裝路徑：$sz" }
          & $sz | Select-Object -First 2
          Write-Host "✅ 7-Zip 已就緒。"

      - name: 🌐 [4/8] 執行 Pip Download 激進拉取
        run: |
          Write-Host "==== [PIP DOWNLOAD START] ===="
          New-Item -ItemType Directory -Path "pip_packages" -Force
          $cmd = "${{ github.event.inputs.pip_command }}"
          
          # 自動補全 --dest 參數，確保文件夾受控
          if ($cmd -notlike "*--dest*") {
              $cmd = "$cmd --dest pip_packages"
          }
          
          Write-Host "🚀 執行指令: $cmd"
          Invoke-Expression "$cmd"
          
          Write-Host "`n✅ 下載清單:"
          Get-ChildItem "pip_packages" | Select-Object Name, @{Name="Size(MB)";Expression={"{0:N2}" -f ($_.Length/1MB)}}

      
      - name: 📄 [5/8] 元數據生成 (時區修正與優化命名)
        run: |
          $nowCST = [DateTime]::UtcNow.AddHours(8)
          # 精度提升到秒，避免同一分鐘內觸發兩次時 tag 撞車
          $cstTimeFormatted = $nowCST.ToString("yyyyMMdd-HHmmss")

          $rawCmd = "${{ github.event.inputs.pip_command }}"
          $cleanName = ($rawCmd -replace 'pip download', '').Trim() -replace '[^a-zA-Z0-9_-]', '-'

          # 【關鍵修復1】移除開頭和結尾的多餘橫線
          $cleanName = $cleanName.Trim('-')

          # 【關鍵修復2】限制檔名長度，防止包含太多 URL 導致檔名超長 (Windows MAX_PATH 限制)
          if ($cleanName.Length -gt 60) {
              $candidate = $cleanName.Substring(0, 60)
              # 截到最近的 '-' 邊界，避免切在詞中間
              $lastDash = $candidate.LastIndexOf('-')
              if ($lastDash -gt 20) { $candidate = $candidate.Substring(0, $lastDash) }
              $cleanName = $candidate.Trim('-')
          }

          if (-not $cleanName) { $cleanName = "pip-pkg" }

          $tagName = "$($cleanName)-$cstTimeFormatted"

          Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=$tagName"
          Write-Host "⏰ 實時東八區時間: $cstTimeFormatted"
          Write-Host "🏷️ Tag 名稱: $tagName"

      - name: 🔪 [6/8] 7z 零壓縮極速分卷
        run: |
          Write-Host "==== [7Z COMPRESSION START] ===="
          $chunkSizeMB = "${{ github.event.inputs.chunk_size_mb }}"
          if ($chunkSizeMB -notmatch '^\d+$') { throw "chunk_size_mb 必須是整數（收到 '$chunkSizeMB'）" }
          $tagName = "$env:TAG_NAME"
          $sz = "C:\Program Files\7-Zip\7z.exe"
          $archive = ".\$tagName.7z"

          # 預清理舊文件，加 -y 跳過 overwrite 交互
          Get-ChildItem "$archive*" -ErrorAction SilentlyContinue | Remove-Item -Force

          # 用 Start-Process 等待並捕獲退出碼與輸出，避免靜默失敗
          $stdout = & $sz a -mx0 -y -v"$($chunkSizeMB)m" $archive ".\pip_packages\*" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "---- 7z output ----"
          Write-Host $stdout
          Write-Host "---- exit code: $code ----"
          if ($code -ge 2) { throw "7z 分卷失敗 (exit=$code)" }
          if ($code -eq 1) { Write-Host "::warning::7z 返回警告 (exit=1)" }

          Remove-Item -Recurse -Force ".\pip_packages\"
          Get-ChildItem ".\$tagName.7z*" | Select-Object Name, @{Name="Size(MB)";Expression={"{0:N2}" -f ($_.Length/1MB)}}

      - name: 🚀 [7/8] 並發無損上傳 (PowerShell Parallel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "$env:TAG_NAME"
          $repo = $env:GITHUB_REPOSITORY
          gh release create "$tag" --repo "$repo" --title "Pip Relay: $tag" --notes "Command: ${{ github.event.inputs.pip_command }}"

          $files = Get-ChildItem "$tag.7z*"
          $files | ForEach-Object -Parallel {
              $file = $_.FullName; $fileName = $_.Name; $tag = $using:tag; $repo = $using:repo
              Write-Host "▶️ 上傳中: $fileName"
              # 指數退避，retry 上限從 5 提到 7；GB 級文件 5 次不够
              for ($attempt = 1; $attempt -le 7; $attempt++) {
                  gh release upload "$tag" "$file" --repo "$repo" --clobber
                  if ($LASTEXITCODE -eq 0) { Write-Host "✅ 成功: $fileName"; return }
                  $sleep = [math]::Min(60, [math]::Pow(2, $attempt))  # 2,4,8,16,32,60,60
                  Write-Host "⚠️ 第 $attempt 次失敗，${sleep}s 後重試..."
                  Start-Sleep -Seconds $sleep
              }
              throw "❌ $fileName 上傳失敗"
          } -ThrottleLimit 4

      - name: 🎉 [8/8] 任務竣工報告
        run: |
          Write-Host "==== [MISSION ACCOMPLISHED] ===="
          Write-Host "🔗 Release 鏈接: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG_NAME"
