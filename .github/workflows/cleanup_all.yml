name: "🧹 Cleanup: Releases + Tags + Actions Runs"

on:
  workflow_dispatch:
    inputs:
      wipe_releases:
        description: '清空所有 Release 和 Tag'
        required: false
        type: boolean
        default: true
      wipe_runs:
        description: '清空所有 Actions 运行记录（含本次运行）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  total-wipeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 [1/5] 检出仓库
        if: ${{ inputs.wipe_releases }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 [2/5] 资源普查
        if: ${{ inputs.wipe_releases }}
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_COUNT=$(gh release list --limit 1000 | wc -l)
          # sed 提取 refs/tags/<name>，正确处理含 "/" 的 tag（v1.0/stable）
          # 末尾的 ^{} 是 annotated tag 的 deref 别名，需过滤
          TAG_COUNT=$(git ls-remote --tags origin \
                      | sed -nE 's|^.*[[:space:]]+refs/tags/([^^]+).*$|\1|p' \
                      | grep -v '\^{}$' | sort -u | wc -l)
          echo "📦 Release: $RELEASE_COUNT,  🏷️ Tag: $TAG_COUNT"
          if [ "$TAG_COUNT" -eq 0 ] && [ "$RELEASE_COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 💣 [3/5] 清空所有 Release（同步删 Tag）
        if: ${{ inputs.wipe_releases && steps.scan.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASES=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          [ -z "$RELEASES" ] && { echo "💡 无 Release"; exit 0; }
          # while-read 替代 for-in，避免 word-splitting
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "▶️ $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag \
              || echo "⚠️ $tag 删除跳过"
          done <<< "$RELEASES"

      - name: 🧹 [4/5] 扫除残留孤立 Tag
        if: ${{ inputs.wipe_releases && steps.scan.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t REMOTE_TAGS < <(
            git ls-remote --tags origin \
              | sed -nE 's|^.*[[:space:]]+refs/tags/([^^]+).*$|\1|p' \
              | grep -v '\^{}$' | sort -u
          )
          [ "${#REMOTE_TAGS[@]}" -eq 0 ] && { echo "✅ 无残留 Tag"; exit 0; }
          for rtag in "${REMOTE_TAGS[@]}"; do
            echo "🗑️ $rtag"
            # 三重 fallback：git push -> gh api -> 跳过；临时关 errexit
            set +e
            git push origin --delete "refs/tags/$rtag" 2>/dev/null \
              || gh api -X DELETE "repos/$REPO/git/refs/tags/$rtag" --silent \
              || echo "💡 $rtag 已不存在"
            set -e
          done

      # SHA-pin：actions:write 权限被入侵会 silent 删光你全部 run history
      - name: 💥 [5/5] 删除所有 Actions 运行记录
        if: ${{ inputs.wipe_runs }}
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c  # v2
        with:
          retain_days: 0
          keep_minimum_runs: 0
