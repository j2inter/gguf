name: "🔍 全平台硬件环境深度侦测"

on:
  workflow_dispatch: # 手动触发

jobs:
  env-scan:
    name: 扫描 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 一次性定义三个平台
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # === Linux 环境扫描 ===
      - name: 🐧 [Linux] 硬件资源深度扫描
        if: runner.os == 'Linux'
        run: |
          echo "==== [SYSTEM INFO] ===="
          echo "内核版本: $(uname -a)"
          echo "发行版: $(cat /etc/os-release | grep PRETTY_NAME)"
          
          echo -e "\n核心架构: $(nproc) Core | $(uname -m)"
          echo "CPU 型号:"
          lscpu | grep "Model name"
          
          echo -e "\n📊 内存状态:"
          free -h
          
          echo -e "\n💽 磁盘空间:"
          df -h .
          
      # === macOS 环境扫描 ===
      - name: 🍎 [macOS] 硬件资源深度扫描
        if: runner.os == 'macOS'
        run: |
          echo "==== [SYSTEM INFO] ===="
          echo "系统版本: $(sw_vers -productVersion) (Build $(sw_vers -buildVersion))"
          
          echo -e "\n核心架构: $(sysctl -n hw.ncpu) Core | $(uname -m)"
          echo "CPU 型号: $(sysctl -n machdep.cpu.brand_string)"
          
          echo -e "\n📊 内存状态 (PhysMem):"
          hostinfo | grep "memory"
          vm_stat | perl -ne '/page size of (\d+) bytes/ and $s=$1; /Pages (\w+):[\s\t]+(\d+)/ and printf("%-15s %10.2f MB\n", $1, $2*$s/1024/1024);'
          
          echo -e "\n💽 磁盘空间:"
          df -h .

      # === Windows 环境扫描 ===
      - name: 🪟 [Windows] 硬件资源深度扫描
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "==== [SYSTEM INFO] ===="
          $info = Get-ComputerInfo
          Write-Host "系统名称: $($info.OsName)"
          Write-Host "核心架构: $env:NUMBER_OF_PROCESSORS Core | $env:PROCESSOR_ARCHITECTURE"
          Write-Host "CPU 型号: $env:PROCESSOR_IDENTIFIER"
          
          Write-Host "`n📊 内存状态 (GB):"
          $mem = Get-CimInstance Win32_OperatingSystem
          $total = [Math]::Round($mem.TotalVisibleMemorySize / 1MB, 2)
          $free = [Math]::Round($mem.FreePhysicalMemory / 1MB, 2)
          Write-Host "总量: $total GB | 剩余: $free GB"
          
          Write-Host "`n💽 磁盘空间 (C盘):"
          Get-PSDrive C | Select-Object Name, @{Name="Used(GB)";Expression={"{0:N2}" -f ($_.Used/1GB)}}, @{Name="Free(GB)";Expression={"{0:N2}" -f ($_.Free/1GB)}}
