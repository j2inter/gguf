name: "🍎 macOS Extreme Pro: GGUF & 7z Relay"

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '目標大文件下載地址'
        required: true
      file_type:
        description: '文件類型與切割策略'
        required: true
        type: choice
        options:
          - gguf
          - other
      chunk_size_mb:
        description: '分卷大小(MB) [最高限制 2047]'
        required: true
        default: '2000'

jobs:
  universal-relay:
    runs-on: macos-latest # 切换为 macOS
    permissions:
      contents: write

    steps:
      - name: 🍏 [1/9] macOS 硬件環境與系統架構掃描
        run: |
          echo "==== [SYSTEM INFO START] ===="
          echo "🖥️ 操作系統: $(sw_vers -productVersion) (Build $(sw_vers -buildVersion))"
          echo "🧠 CPU 架構: $(uname -m)"
          echo "💡 處理器細節: $(sysctl -n machdep.cpu.brand_string)"
          echo "🚀 核心數: $(sysctl -n hw.ncpu) Core"
          
          echo -e "\n📊 內存分佈 (vm_stat):"
          vm_stat
          
          echo -e "\n💽 磁盤掛載狀態:"
          df -Th
          echo "==== [SYSTEM INFO END] ===="

      - name: 🔍 [2/9] 物理空間嗅探 (macOS 版)
        id: precheck
        run: |
          # macOS 監測邏輯
          FREE_SPACE_MB=$(df -m . | awk 'NR==2 {print $4}')
          echo -e "\n[📈 實時資源監控] 磁盤可用: ${FREE_SPACE_MB} MB\n"
          
          URL="${{ github.event.inputs.model_url }}"
          SIZE=$(curl -sIL "$URL" | grep -i -E "^Content-Length:" | tail -n 1 | awk '{print $2}' | tr -d '\r')
          
          if [ -z "$SIZE" ] || ! [[ "$SIZE" =~ ^[0-9]+$ ]]; then
            echo "need_clean=true" >> $GITHUB_OUTPUT
          else
            SIZE_MB=$((SIZE / 1024 / 1024))
            REQUIRED_MB=$(( SIZE_MB * 2 + 2048 )) # macOS 緩衝給 2GB
            if [ "$REQUIRED_MB" -gt "$FREE_SPACE_MB" ]; then
              echo "need_clean=true" >> $GITHUB_OUTPUT
            else
              echo "need_clean=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 🧹 [3/9] macOS 磁盤空間優化
        if: steps.precheck.outputs.need_clean == 'true'
        run: |
          echo "==== [MACOS CLEANUP] ===="
          # macOS 清理邏輯：刪除 Xcode 舊版本、模擬器等（如果存在）
          sudo rm -rf /Applications/Xcode_*.app
          brew cleanup
          # 注意：jlumbroso/free-disk-space 主要針對 Linux，macOS 需手動清理

      - name: 🛠️ [4/9] Brew 工具鏈部署 (核心適配)
        run: |
          echo "==== [INSTALLING DEPENDENCIES] ===="
          # 安裝 coreutils 以獲得 gsplit, gstat 等 GNU 工具
          brew install aria2 p7zip coreutils
          echo "✅ GNU Coreutils, Aria2, p7zip 部署完畢。"

      - name: 🌐 [5/9] 遠端鏈接解析與元數據註入
        run: |
          URL="${{ github.event.inputs.model_url }}"
          RAW_NAME=$(basename "${URL%%\?*}")
          SAFE_BASE_NAME="${RAW_NAME%.*}"
          SAFE_BASE_NAME="${SAFE_BASE_NAME// /-}"
          
          echo "RAW_NAME=$RAW_NAME" >> $GITHUB_ENV
          echo "BASE_NAME=$SAFE_BASE_NAME" >> $GITHUB_ENV
          echo "CST_TIME=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: ⬇️ [6/9] Aria2 激進併發下載
        run: |
          echo -e "\n[📈 實時資源監控] 磁盤可用: $(df -h . | awk 'NR==2 {print $4}')\n"
          aria2c -x 16 -s 16 -k 1M --console-log-level=notice --file-allocation=none \
          "${{ github.event.inputs.model_url }}" -o "${{ env.RAW_NAME }}"

      - name: 🔪 [7/9] GNU-Style 分支切割 (適配 macOS)
        run: |
          echo "==== [SPLIT ENGINE START] ===="
          RAW="${{ env.RAW_NAME }}"
          BASE="${{ env.BASE_NAME }}"
          INPUT_MB="${{ github.event.inputs.chunk_size_mb }}"
          MAX_BYTES=2147483647
          
          # 使用 gstat (GNU stat) 保持邏輯一致
          FILE_SIZE=$(gstat -c%s "$RAW")
          
          USER_BYTES=$((INPUT_MB * 1024 * 1024))
          if [ "$USER_BYTES" -gt "$MAX_BYTES" ]; then CHUNK_BYTES=$MAX_BYTES; else CHUNK_BYTES=$USER_BYTES; fi
          
          TOTAL=$(( (FILE_SIZE + CHUNK_BYTES - 1) / CHUNK_BYTES ))
          TOTAL_PAD=$(printf "%05d" $TOTAL)
          
          if [ "${{ github.event.inputs.file_type }}" = "gguf" ]; then
            # 使用 gsplit (GNU split) 支持 --additional-suffix
            gsplit -b $CHUNK_BYTES -d -a 5 --numeric-suffixes=1 \
                  --additional-suffix="-of-$TOTAL_PAD.gguf" "$RAW" "$BASE-"
          else
            7z a -mx0 -v${CHUNK_BYTES}b "${BASE}.7z" "$RAW"
          fi
          rm -f "$RAW"
          ls -lh "${BASE}"*

      - name: 🚀 [8/9] 併發無損上傳與進程監控
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ env.BASE_NAME }}-${{ env.CST_TIME }}-${{ github.event.inputs.file_type }}"
          gh release create "$TAG" --repo "$REPO" --title "macOS Relay: ${{ env.BASE_NAME }}"
          
          # macOS 的 xargs 或併發邏輯與 Linux 略有不同，這裡沿用 Bash 函數
          upload_with_retry() {
            local file=$1; local tag=$2; local repo=$3; local attempt=1
            while [ $attempt -le 5 ]; do
              if gh release upload "$tag" "$file" --repo "$repo" --clobber; then return 0; fi
              sleep $((attempt * 5)); attempt=$((attempt + 1))
            done
            return 1
          }
          export -f upload_with_retry
          
          # 併發上傳
          pids=()
          for f in "${{ env.BASE_NAME }}"*; do
            upload_with_retry "$f" "$TAG" "$REPO" &
            pids+=($!)
            if [[ $(jobs -r | wc -l) -ge 6 ]]; then wait -n; fi
          done
          for pid in "${pids[@]}"; do wait $pid || exit 1; done
          echo "URL_TAG=$TAG" >> $GITHUB_ENV

      - name: 🎉 [9/9] 任務竣工報告
        run: |
          echo "==== [MISSION ACCOMPLISHED] ===="
          echo "🔗 Release 傳送門: https://github.com/${{ github.repository }}/releases/tag/${{ env.URL_TAG }}"
