name: Download LM Studio CUDA 12 Runtime & Release

on:
  workflow_dispatch:        # 手动触发
  schedule:
    - cron: '0 3 * * 0'     # 每周日凌晨3点自动运行（可选）

jobs:
  download-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LM Studio Headless (llmster + CLI)
        run: |
          Write-Host "Installing LM Studio headless CLI (llmster)..."
          irm https://lmstudio.ai/install.ps1 | iex
        shell: pwsh

      - name: Add lms to PATH
        run: |
          $lmstudioBin = "$env:USERPROFILE\.lmstudio\bin"
          echo $lmstudioBin | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          $env:PATH = "$lmstudioBin;$env:PATH"
        shell: pwsh

      - name: Verify lms CLI
        run: |
          lms --version
          lms runtime ls
        shell: pwsh

      - name: Download CUDA 12 Runtime
        run: |
          Write-Host "Downloading CUDA 12 Runtime..."
          # 非交互式下载（推荐写法）
          lms runtime get "CUDA 12 llama.cpp (Windows)" --yes --force
        shell: pwsh

      - name: List installed runtimes (检查)
        run: |
          lms runtime ls
        shell: pwsh

      - name: Zip the runtime folder
        run: |
          $runtimePath = "$env:USERPROFILE\.lmstudio\runtimes"
          $zipPath = "lmstudio-cuda12-runtime.zip"
          
          if (Test-Path $runtimePath) {
            Compress-Archive -Path "$runtimePath\*" -DestinationPath $zipPath -Force
            Write-Host "✅ Runtime successfully zipped: $zipPath"
          } else {
            Write-Error "❌ Runtime folder not found!"
            exit 1
          }
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuda12-runtime-latest
          name: LM Studio CUDA 12 Runtime (Auto ${{ github.run_number }})
          body: |
            自动打包的 LM Studio CUDA 12 llama.cpp Runtime（Windows）
            
            下载日期: ${{ format('{0:yyyy-MM-dd HH:mm:ss}', github.event.repository.updated_at) }}
            使用方法：
            1. 解压 lmstudio-cuda12-runtime.zip
            2. 覆盖到 `C:\Users\你的用户名\.lmstudio\runtimes\` 文件夹
          files: lmstudio-cuda12-runtime.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}