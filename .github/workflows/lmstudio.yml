name: Download LM Studio CUDA 12 Runtime & Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # 每周自动更新（可选）

jobs:
  download-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LM Studio Headless (llmster)
        run: |
          Write-Host "Installing LM Studio headless..."
          irm https://lmstudio.ai/install.ps1 | iex
        shell: pwsh

      - name: Add lms to PATH
        run: |
          $binPath = "$env:USERPROFILE\.lmstudio\bin"
          echo $binPath | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          $env:PATH = "$binPath;$env:PATH"
        shell: pwsh

      - name: Verify lms
        run: lms --version
        shell: pwsh

      - name: List available runtimes (调试用)
        run: |
          Write-Host "=== Available Runtimes ==="
          lms runtime get --help
        shell: pwsh

      - name: Download CUDA 12 Runtime (核心修复)
        run: |
          Write-Host "Downloading CUDA 12 llama.cpp Runtime..."
          # 先尝试精确名称（最常用）
          lms runtime get "CUDA 12 llama.cpp (Windows)" --yes --force || ^
          lms runtime get "CUDA 12" --yes --force || ^
          lms runtime get cuda12 --yes --force
        shell: pwsh

      - name: Check installed runtimes
        run: |
          Write-Host "=== Installed Runtimes ==="
          lms runtime ls
        shell: pwsh

      - name: Zip Runtime Folder
        run: |
          $runtimePath = "$env:USERPROFILE\.lmstudio\runtimes"
          $zipPath = "lmstudio-cuda12-runtime.zip"
          
          if (Test-Path "$runtimePath") {
            Compress-Archive -Path "$runtimePath\*" -DestinationPath $zipPath -Force
            Write-Host "✅ Successfully zipped: $zipPath"
          } else {
            Write-Error "❌ No runtime folder found!"
            exit 1
          }
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuda12-runtime-latest
          name: LM Studio CUDA 12 Runtime (Latest)
          body: |
            自动打包的 LM Studio CUDA 12 llama.cpp Runtime（Windows）
            
            使用方法：
            1. 下载 lmstudio-cuda12-runtime.zip
            2. 解压后覆盖到 `C:\Users\你的用户名\.lmstudio\runtimes\`
          files: lmstudio-cuda12-runtime.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}