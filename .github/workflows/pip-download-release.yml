name: Pip Download & Release

on:
  workflow_dispatch:
    inputs:
      pip_args:
        description: 'pip download 后面的所有参数。支持 --index-url/-i、--extra-index-url、--find-links/-f、--platform、--python-version、--only-binary、--no-deps 等任意 pip 选项；若未指定 -d/--dest 则自动写入 ./download'
        required: true
        default: 'requests'
      pip_extra:
        description: '可选：拼到末尾的额外参数（如：-i https://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com）'
        required: false
        default: ''
      pkg_name:
        description: '产物名称（用于压缩包和 Release 文件名，不含扩展名）'
        required: false
        default: 'pip-packages'
      volume_size:
        description: '第二次分卷压缩的单卷大小（例如 100M、500M、1G）'
        required: false
        default: '500M'
      tag_name:
        description: 'Release 的 tag 名称（留空则自动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve names
        id: vars
        shell: pwsh
        run: |
          $pkg = "${{ inputs.pkg_name }}"
          if ([string]::IsNullOrWhiteSpace($pkg)) { $pkg = "pip-packages" }
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $tag = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "$pkg-$stamp" }
          "pkg=$pkg" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: pip download
        shell: pwsh
        run: |
          $args1 = "${{ inputs.pip_args }}"
          $args2 = "${{ inputs.pip_extra }}"
          $dest  = "download"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # 若用户已自带 -d / --dest / -d=... / --dest=...，则不重复注入
          $hasDest = $args1 -match '(^|\s)(-d|--dest)(\s|=)' -or $args2 -match '(^|\s)(-d|--dest)(\s|=)'
          $fullArgs = "$args1 $args2".Trim()
          if (-not $hasDest) { $fullArgs = "$fullArgs -d $dest" }

          Write-Host "==== pip download invocation ===="
          Write-Host "python -m pip download $fullArgs"
          Write-Host "================================"

          python -m pip install --upgrade pip
          # 显式按 shell 词法分词后传 array，避开 PowerShell 对引号/反引号的二次解释
          $argArray = $fullArgs -split '\s+' | Where-Object { $_ -ne '' }
          & python -m pip download @argArray
          if ($LASTEXITCODE -ne 0) { throw "pip download failed (exit=$LASTEXITCODE)" }

          # 实际目录可能因用户指定 -d 而不在 ./download，扫一遍当前目录所有 *.whl / *.tar.gz
          Write-Host "---- downloaded files ----"
          Get-ChildItem -Recurse -Include '*.whl','*.tar.gz','*.zip','*.egg' | Select-Object FullName, Length

      - name: First compression (single .7z)
        shell: pwsh
        run: |
          $pkg  = "${{ steps.vars.outputs.pkg }}"
          $sz   = "C:\Program Files\7-Zip\7z.exe"
          $here = (Get-Location).Path
          $first = Join-Path $here "$pkg.7z"
          Write-Host "PWD       : $here"
          Write-Host "Inner 7z  : $first"

          # 收集 pip 产物：可能落地点是 ./download，也可能是用户自定义 -d 路径
          $payloads = Get-ChildItem -Recurse -Include '*.whl','*.tar.gz','*.zip','*.egg' -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -notlike "$first*" }
          if (-not $payloads -or $payloads.Count -eq 0) { throw "no pip artifacts (*.whl/*.tar.gz/*.zip/*.egg) found under $here" }
          $manifest = Join-Path $here "_manifest.txt"
          $payloads | ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName } | Set-Content -Encoding utf8 $manifest
          Write-Host "Found $($payloads.Count) artifact(s), total $([math]::Round(($payloads | Measure-Object Length -Sum).Sum/1MB,2)) MB"

          if (Test-Path $first) { Remove-Item -Force $first }
          # @listfile 模式：把每个绝对路径写入清单交给 7z，避免命令行长度限制和 glob 解析歧义
          $out = & $sz a -t7z -mx=5 -y $first "@$manifest" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "---- 7z output ----"
          Write-Host $out
          Write-Host "---- exit code: $code ----"
          if ($code -ge 2) { throw "7z first archive FAILED (exit=$code)" }
          if ($code -eq 1) { Write-Host "::warning::7z first archive returned warnings (exit=1)" }
          Get-ChildItem $first | Select-Object FullName, Length

      - name: Second compression (split volumes)
        shell: pwsh
        run: |
          $pkg  = "${{ steps.vars.outputs.pkg }}"
          $size = "${{ inputs.volume_size }}"
          $sz   = "C:\Program Files\7-Zip\7z.exe"
          $here = (Get-Location).Path
          $first = Join-Path $here "$pkg.7z"
          $outer = Join-Path $here "$pkg.outer.7z"
          Write-Host "PWD       : $here"
          Write-Host "Inner 7z  : $first  (exists=$(Test-Path $first))"
          Write-Host "Outer 7z  : $outer"
          Write-Host "Volume sz : $size"
          if (-not (Test-Path $first)) { throw "inner archive not found: $first" }
          Get-ChildItem "$pkg.outer.7z*" -ErrorAction SilentlyContinue | Remove-Item -Force
          $out = & $sz a -t7z -mx=5 -y -v"$size" $outer $first 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "---- 7z output ----"
          Write-Host $out
          Write-Host "---- exit code: $code ----"
          if ($code -ge 2) { throw "7z split archive FAILED (exit=$code)" }
          if ($code -eq 1) { Write-Host "::warning::7z split archive returned warnings (exit=1)" }
          Get-ChildItem "$pkg.outer.7z*" | Select-Object Name, Length

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.pkg }} (${{ steps.vars.outputs.stamp }})
          generate_release_notes: false
          body: |
            pip download 参数：
            ```
            ${{ inputs.pip_args }}
            ```
            - 第一次压缩：`${{ steps.vars.outputs.pkg }}.7z`（内含 `download/` 目录下所有 whl/tar.gz）
            - 第二次压缩分卷：`${{ steps.vars.outputs.pkg }}.outer.7z.001`、`.002` …
              解压：`7z x ${{ steps.vars.outputs.pkg }}.outer.7z.001`，得到内层 `${{ steps.vars.outputs.pkg }}.7z`，再次 `7z x` 即可。
          files: |
            ${{ steps.vars.outputs.pkg }}.7z
            ${{ steps.vars.outputs.pkg }}.outer.7z.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
