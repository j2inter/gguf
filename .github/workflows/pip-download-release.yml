name: "📦 Pip / URL Download & Release"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        type: choice
        default: 'pip'
        options:
          - pip
          - url
      pip_args:
        description: 'pip 模式：pip download 后面的参数'
        required: false
        default: 'requests'
      source_url:
        description: 'url 模式：下载地址'
        required: false
        default: ''
      pkg_name:
        description: '产物名称前缀'
        required: false
        default: 'pip-packages'
      volume_size:
        description: '分卷大小（如 500M、1G）'
        required: false
        default: '500M'
      tag_name:
        description: 'Release tag（留空自动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: inputs.mode == 'pip'
        with:
          python-version: '3.12'

      - name: Resolve names
        id: vars
        shell: pwsh
        run: |
          $pkg = "${{ inputs.pkg_name }}"
          if ([string]::IsNullOrWhiteSpace($pkg)) { $pkg = "download" }
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $tag = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "$pkg-$stamp" }
          "pkg=$pkg"   | Add-Content $env:GITHUB_OUTPUT
          "tag=$tag"   | Add-Content $env:GITHUB_OUTPUT
          "stamp=$stamp" | Add-Content $env:GITHUB_OUTPUT

      - name: Download (pip)
        if: inputs.mode == 'pip'
        shell: pwsh
        run: |
          $args = "${{ inputs.pip_args }}"
          if ([string]::IsNullOrWhiteSpace($args)) { throw "pip_args is empty" }

          # 用户若已自带 -d/--dest，就让 pip 走自己的路径，否则强制 -d download
          New-Item -ItemType Directory -Force download | Out-Null
          $hasDest = $args -match '(^|\s)(-d|--dest)(\s|=)'
          $cmd = if ($hasDest) { "python -m pip download $args" } else { "python -m pip download $args -d download" }
          Write-Host "::group::Invoking: $cmd"
          python -m pip install --upgrade pip
          Invoke-Expression $cmd
          $code = $LASTEXITCODE
          Write-Host "::endgroup::"
          if ($code -ne 0) { throw "pip download failed (exit=$code)" }

          # 预检查：必须真的产出文件，否则下面 7z 会静默生成 32 字节空档（PR #4 踩过的坑）
          $found = Get-ChildItem -Recurse -Include '*.whl','*.tar.gz','*.zip','*.egg' -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) {
            throw "pip download produced no artifacts (*.whl/*.tar.gz/*.zip/*.egg) under $(Get-Location). 检查上面的 pip 输出。"
          }
          Write-Host "✅ Found $($found.Count) artifact(s):"
          $found | Select-Object FullName, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Download (url)
        if: inputs.mode == 'url'
        shell: pwsh
        run: |
          $url = "${{ inputs.source_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) { throw "source_url is empty" }
          New-Item -ItemType Directory -Force download | Out-Null
          # 从 URL 取文件名；query string 截掉；取不到就用时间戳
          $name = [System.IO.Path]::GetFileName(([System.Uri]$url).AbsolutePath)
          if ([string]::IsNullOrWhiteSpace($name)) { $name = "payload-$(Get-Date -Format yyyyMMddHHmmss).bin" }
          Write-Host "Downloading: $url"
          Write-Host "Saving as  : download\$name"
          $ProgressPreference = 'SilentlyContinue'   # 关进度条，IWR 在大文件时能快好几倍
          Invoke-WebRequest -Uri $url -OutFile "download\$name" -UseBasicParsing
          Get-ChildItem download | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: First compression (single .7z)
        shell: pwsh
        run: |
          $pkg = "${{ steps.vars.outputs.pkg }}"
          $sz  = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path "$pkg.7z") { Remove-Item -Force "$pkg.7z" }

          # 输入选择：
          #  - 若 ./download 非空 -> 用 ".\download\*" 通配（最常见路径）
          #  - 若空（用户在 pip_args 里自带 -d /other/path）-> 全目录递归扫 *.whl/*.tar.gz/*.zip/*.egg 写 listfile
          #    注意 7z @listfile 必须 **每行一个路径**，不要加 size 前缀（PR #4 的 bug 就是写成 "size\tpath" 导致 7z 全部当无效路径）
          $srcDir = ".\download"
          $hasFiles = (Test-Path $srcDir) -and ((Get-ChildItem $srcDir -Recurse -File -ErrorAction SilentlyContinue).Count -gt 0)
          if ($hasFiles) {
            $input4sz = "$srcDir\*"
            Write-Host "Source mode : dir-glob ($srcDir)"
          } else {
            $payloads = Get-ChildItem -Recurse -Include '*.whl','*.tar.gz','*.zip','*.egg' -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -notlike "*$pkg.7z*" }
            if (-not $payloads -or $payloads.Count -eq 0) { throw "no artifacts to compress" }
            $list = "_files.txt"
            $payloads | ForEach-Object { $_.FullName } | Set-Content -Encoding ASCII $list
            $input4sz = "@$list"
            Write-Host "Source mode : listfile ($list, $($payloads.Count) entries)"
          }

          $out = & $sz a -t7z -mx=5 -y "$pkg.7z" $input4sz 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "exit code: $code"
          if ($code -ge 2) { throw "first 7z failed (exit=$code)" }

          # 兜底：32 字节是 7z 空 archive 的大小，说明实际上没压进任何东西（PR #4 静默踩坑）
          $sz7 = (Get-Item "$pkg.7z").Length
          if ($sz7 -le 64) {
            throw "first 7z is suspiciously small ($sz7 bytes) -- nothing was actually archived. See 7z output above."
          }
          Get-Item "$pkg.7z" | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Second compression (split volumes) + rename to *.7z
        shell: pwsh
        run: |
          $pkg  = "${{ steps.vars.outputs.pkg }}"
          $size = "${{ inputs.volume_size }}"
          $sz   = "C:\Program Files\7-Zip\7z.exe"
          Get-ChildItem "$pkg.outer.7z*" -ErrorAction SilentlyContinue | Remove-Item -Force

          $out = & $sz a -t7z -mx=5 -y -v"$size" "$pkg.outer.7z" "$pkg.7z" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "exit code: $code"
          if ($code -ge 2) { throw "split 7z failed (exit=$code)" }

          # 防火墙只放行 .7z 后缀 -> 给每个分卷再追加一层 .7z
          Get-ChildItem "$pkg.outer.7z.*" | Where-Object { $_.Name -notlike '*.7z.7z' } | ForEach-Object {
            Rename-Item $_.FullName -NewName "$($_.Name).7z"
          }
          Write-Host "---- renamed volumes ----"
          Get-ChildItem "$pkg.outer.7z.*" | Select-Object Name, Length

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.pkg }} (${{ steps.vars.outputs.stamp }})
          generate_release_notes: false
          body: |
            Mode: `${{ inputs.mode }}`
            ```
            ${{ inputs.mode == 'pip' && inputs.pip_args || inputs.source_url }}
            ```

            **下载后解压**（每个分卷末尾多了一层 `.7z` 用于绕过防火墙，先去掉再解）：

            Windows PowerShell：
            ```powershell
            Get-ChildItem "${{ steps.vars.outputs.pkg }}.outer.7z.*.7z" |
              Rename-Item -NewName { $_.Name -replace '\.7z$','' }
            7z x "${{ steps.vars.outputs.pkg }}.outer.7z.001"
            7z x "${{ steps.vars.outputs.pkg }}.7z"
            ```

            Linux / macOS：
            ```bash
            for f in ${{ steps.vars.outputs.pkg }}.outer.7z.*.7z; do mv "$f" "${f%.7z}"; done
            7z x ${{ steps.vars.outputs.pkg }}.outer.7z.001
            7z x ${{ steps.vars.outputs.pkg }}.7z
            ```
          files: |
            ${{ steps.vars.outputs.pkg }}.7z
            ${{ steps.vars.outputs.pkg }}.outer.7z.*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
