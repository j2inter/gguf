name: "📦 Download & Release"

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'pip download 命令 或 URL'
        required: true
        default: 'pip download requests'
      volume_size_mb:
        description: '分卷大小 (MB)，太小则自动调成至少 2 份'
        required: false
        default: '500'
      tag_name:
        description: 'Release tag（留空自动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse input
        id: vars
        shell: pwsh
        run: |
          $src = "${{ inputs.source }}".Trim()
          if ([string]::IsNullOrWhiteSpace($src)) { throw "source is empty" }

          # 去掉前缀 'pip download' / 'pip3 download' / 'python -m pip download'
          $stripped = $src -replace '^\s*(python\s+-m\s+)?pip3?\s+download\s+', ''

          # 模式识别：URL 以 http:// 或 https:// 开头
          if ($src -match '^\s*https?://') { $mode = 'url' } else { $mode = 'pip' }

          # 自动命名
          if ($mode -eq 'url') {
            try { $raw = [System.IO.Path]::GetFileNameWithoutExtension(([System.Uri]$src).AbsolutePath) }
            catch { $raw = '' }
          } else {
            # 取第一个非 flag、非选项值的 token
            $tokens = $stripped -split '\s+' | Where-Object { $_ -and -not $_.StartsWith('-') }
            $raw = $tokens | Select-Object -First 1
            # 去掉 version specifier: requests==2.0 -> requests
            if ($raw) { $raw = ($raw -split '[=<>!~\[]')[0] }
          }
          if ([string]::IsNullOrWhiteSpace($raw)) { $raw = 'download' }

          # 文件名安全化
          $pkg = ($raw -replace '[^a-zA-Z0-9_.-]', '-').Trim('-._')
          if ($pkg.Length -gt 80) { $pkg = $pkg.Substring(0, 80).Trim('-._') }
          if ([string]::IsNullOrWhiteSpace($pkg)) { $pkg = 'download' }

          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $tag = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "$pkg-$stamp" }

          Write-Host "Mode      : $mode"
          Write-Host "Stripped  : $stripped"
          Write-Host "Pkg name  : $pkg"
          Write-Host "Tag name  : $tag"

          "mode=$mode"     | Add-Content $env:GITHUB_OUTPUT
          "stripped=$stripped" | Add-Content $env:GITHUB_OUTPUT
          "pkg=$pkg"       | Add-Content $env:GITHUB_OUTPUT
          "tag=$tag"       | Add-Content $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.vars.outputs.mode == 'pip'
        with:
          python-version: '3.12'

      - name: Download (pip)
        if: steps.vars.outputs.mode == 'pip'
        shell: pwsh
        run: |
          $args = "${{ steps.vars.outputs.stripped }}"
          if ([string]::IsNullOrWhiteSpace($args)) { throw "no pip args after stripping 'pip download'" }
          New-Item -ItemType Directory -Force download | Out-Null
          $hasDest = $args -match '(^|\s)(-d|--dest)(\s|=)'
          $cmd = if ($hasDest) { "python -m pip download $args" } else { "python -m pip download $args -d download" }
          Write-Host "Invoking: $cmd"
          python -m pip install --upgrade pip
          Invoke-Expression $cmd
          if ($LASTEXITCODE -ne 0) { throw "pip download failed (exit=$LASTEXITCODE)" }
          $found = Get-ChildItem -Recurse -Include '*.whl','*.tar.gz','*.zip','*.egg' -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) { throw "pip download produced no artifacts" }
          Write-Host "✅ $($found.Count) artifact(s), total $([math]::Round(($found | Measure-Object Length -Sum).Sum/1MB,2)) MB"

      - name: Download (url)
        if: steps.vars.outputs.mode == 'url'
        shell: pwsh
        run: |
          $url = "${{ inputs.source }}".Trim()
          New-Item -ItemType Directory -Force download | Out-Null
          $name = [System.IO.Path]::GetFileName(([System.Uri]$url).AbsolutePath)
          if ([string]::IsNullOrWhiteSpace($name)) { $name = "payload-$(Get-Date -Format yyyyMMddHHmmss).bin" }
          Write-Host "GET $url"
          Write-Host "-> download\$name"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile "download\$name" -UseBasicParsing
          Get-ChildItem download | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Compress + split
        shell: pwsh
        run: |
          $pkg  = "${{ steps.vars.outputs.pkg }}"
          $sz   = "C:\Program Files\7-Zip\7z.exe"
          $volMB = 0
          if (-not [int]::TryParse("${{ inputs.volume_size_mb }}", [ref]$volMB) -or $volMB -le 0) {
            throw "volume_size_mb 必须是正整数（收到 '${{ inputs.volume_size_mb }}'）"
          }

          # ---- 第一层：把 ./download 压成单 .7z（mx=0 仅存储，最快）----
          if (Test-Path "$pkg.7z") { Remove-Item -Force "$pkg.7z" }
          $srcDir = ".\download"
          $hasFiles = (Test-Path $srcDir) -and ((Get-ChildItem $srcDir -Recurse -File).Count -gt 0)
          if ($hasFiles) {
            $input4sz = "$srcDir\*"
          } else {
            $payloads = Get-ChildItem -Recurse -Include '*.whl','*.tar.gz','*.zip','*.egg' -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -notlike "*$pkg.7z*" }
            if (-not $payloads -or $payloads.Count -eq 0) { throw "no artifacts to compress" }
            $payloads | ForEach-Object { $_.FullName } | Set-Content -Encoding ASCII _files.txt
            $input4sz = "@_files.txt"
          }
          $out = & $sz a -t7z -mx=0 -y "$pkg.7z" $input4sz 2>&1 | Out-String
          if ($LASTEXITCODE -ge 2) { Write-Host $out; throw "first 7z failed (exit=$LASTEXITCODE)" }
          $inner = [int64](Get-Item "$pkg.7z").Length
          if ($inner -le 64) { Write-Host $out; throw "first 7z is suspiciously small ($inner bytes)" }
          Write-Host "Inner 7z: $inner bytes ($([math]::Round($inner/1MB,2)) MB)"

          # ---- 探测：先做一次非分卷的 outer 7z，仅为测出真实大小 ----
          # 必要原因：outer = inner + 7z 容器 header (~200B)。
          # 旧版按 inner 算分卷，外层多出的 header 会"溢出"出第 3 卷（小文件场景下肉眼可见的 bug）
          $probe = "$pkg.outer.probe.7z"
          if (Test-Path $probe) { Remove-Item -Force $probe }
          $out = & $sz a -t7z -mx=0 -y $probe "$pkg.7z" 2>&1 | Out-String
          if ($LASTEXITCODE -ge 2) { Write-Host $out; throw "probe 7z failed" }
          $outer = [int64](Get-Item $probe).Length
          Remove-Item -Force $probe
          Write-Host "Outer (probe): $outer bytes  (7z overhead = $($outer - $inner) bytes)"

          # ---- 分卷大小决策：基于真实 outer，单位 bytes ----
          $userVolBytes = [int64]$volMB * 1MB
          $partsIfUser  = [math]::Ceiling($outer / $userVolBytes)
          if ($partsIfUser -ge 2) {
            $volBytes = $userVolBytes
            $note = "用户设定 ${volMB}MB，约 ${partsIfUser} 卷"
          } else {
            $volBytes = [math]::Max(1, [int64][math]::Ceiling($outer / 2))
            $note = "auto-shrink：用户 ${volMB}MB 只能切 1 卷，改为 ${volBytes} bytes 强制 2 卷"
          }
          Write-Host "Volume decided: $volBytes bytes  ($note)"

          # ---- 第二层：正式分卷 ----
          Get-ChildItem "$pkg.outer.7z*" -ErrorAction SilentlyContinue | Remove-Item -Force
          $out = & $sz a -t7z -mx=0 -y "-v${volBytes}b" "$pkg.outer.7z" "$pkg.7z" 2>&1 | Out-String
          if ($LASTEXITCODE -ge 2) { Write-Host $out; throw "split 7z failed (exit=$LASTEXITCODE)" }

          # 防火墙只放行 .7z -> 给每个 .001/.002 追加一层 .7z
          Get-ChildItem "$pkg.outer.7z.*" | Where-Object { $_.Name -notlike '*.7z.7z' } | ForEach-Object {
            Rename-Item $_.FullName -NewName "$($_.Name).7z"
          }

          # 删掉内层 .7z，避免 release 误上传
          Remove-Item -Force "$pkg.7z"

          Write-Host "---- final volumes ----"
          Get-ChildItem "$pkg.outer.7z.*.7z" | Select-Object Name, Length, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: false
          body: |
            ```
            ${{ inputs.source }}
            ```
          files: |
            ${{ steps.vars.outputs.pkg }}.outer.7z.*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
