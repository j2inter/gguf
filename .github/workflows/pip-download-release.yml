name: "📦 Download & Release"

# 同一 source 并行时排队，不互相 cancel
concurrency:
  group: ${{ github.workflow }}-${{ inputs.source }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'pip download 命令 或 URL'
        required: true
        default: 'pip download requests'
      volume_size_mb:
        description: '分卷大小 (MB)，太小则自动调成至少 2 份'
        required: false
        default: '500'
      zip_level:
        description: '内层 zip 压缩档位（外层 7z 固定 store，别动）'
        type: choice
        required: false
        default: 'store'
        options:
          - store      # -mx0，纯打包不压缩（原行为）
          - fast       # -mx1  + 多线程，轻度压缩
          - balanced   # -mx5  + 多线程
          - high       # -mx9  + 多线程，慢，收益已饱和
      tag_name:
        description: 'Release tag（留空自动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60    # 防止 hang 住的 curl/pip 吃掉配额

    steps:
      # 刻意不 checkout：不读仓库代码，只生成产物；发 Release 走 API 不需要工作副本

      - name: Resolve params
        id: vars
        shell: pwsh
        run: |
          $src = "${{ inputs.source }}".Trim()
          if ([string]::IsNullOrWhiteSpace($src)) { throw "source is empty" }

          $mode = if ($src -match '^\s*https?://') { 'url' } else { 'pip' }

          if ($mode -eq 'url') {
            $raw = ''
            try {
              $uri = [System.Uri]$src
              $raw = [System.IO.Path]::GetFileNameWithoutExtension($uri.AbsolutePath)
            } catch {
              Write-Host "::warning::URI 解析失败: $_; 将使用 fallback 名"
            }
          } else {
            # 去掉 'pip download' / 'pip3 download' / 'python -m pip download' 前缀
            $stripped = $src -replace '^\s*(python\s+-m\s+)?pip3?\s+download\s+', ''
            $tokens = $stripped -split '\s+' | Where-Object { $_ -and -not $_.StartsWith('-') }
            $raw = $tokens | Select-Object -First 1
            # requests==2.0 -> requests, foo[extra] -> foo
            if ($raw) { $raw = ($raw -split '[=<>!~\[]')[0] }
          }
          if ([string]::IsNullOrWhiteSpace($raw)) { $raw = 'download' }

          # 文件名安全化：保留 a-zA-Z0-9_.-，其余换成 -
          $pkg = ($raw -replace '[^a-zA-Z0-9_.-]', '-').Trim('-._')
          if ($pkg.Length -gt 80) { $pkg = $pkg.Substring(0, 80).Trim('-._') }
          if ([string]::IsNullOrWhiteSpace($pkg)) { $pkg = 'download' }

          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $tag = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "$pkg-$stamp" }

          Write-Host "Mode      : $mode"
          Write-Host "Pkg name  : $pkg"
          Write-Host "Tag name  : $tag"

          "mode=$mode" | Add-Content $env:GITHUB_OUTPUT
          "pkg=$pkg"   | Add-Content $env:GITHUB_OUTPUT
          "tag=$tag"   | Add-Content $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.vars.outputs.mode == 'pip'
        with:
          python-version: '3.12'

      - name: Download (pip)
        if: steps.vars.outputs.mode == 'pip'
        shell: pwsh
        run: |
          $pipArgs = "${{ inputs.source }}".Trim()
          if ([string]::IsNullOrWhiteSpace($pipArgs)) { throw "source is empty" }

          # 剥前缀，再剥用户自带的 -d/--dest（输出目录固定 ./download，路径必须可预测）
          $pipArgs = $pipArgs -replace '^\s*(python\s+-m\s+)?pip3?\s+download\s+', ''
          $hadDest = $pipArgs -match '(^|\s)(-d|--dest)(\s|=)'
          if ($hadDest) {
            Write-Host "::warning::detected -d/--dest in your pip_args; it will be stripped and replaced with '-d download' for predictable output location"
            $pipArgs = $pipArgs -replace '(^|\s)(-d|--dest)(\s+[^\s]+|=[^\s]+)', ' '
          }
          $pipArgs = $pipArgs.Trim()
          if ([string]::IsNullOrWhiteSpace($pipArgs)) { throw "no pip args after stripping 'pip download' prefix" }

          New-Item -ItemType Directory -Force download | Out-Null

          # array splat 调用，不用 Invoke-Expression（避免 PS 对引号/反引号/$ 的二次解析）
          $argArr = @('-m', 'pip', 'download') + ($pipArgs -split '\s+' | Where-Object { $_ }) + @('-d', 'download')
          Write-Host "Invoking: python $($argArr -join ' ')"
          & python @argArr
          if ($LASTEXITCODE -ne 0) { throw "pip download failed (exit=$LASTEXITCODE)" }

          $found = @(Get-ChildItem 'download' -Recurse -File -ErrorAction SilentlyContinue)
          if ($found.Count -eq 0) { throw "pip download produced no artifacts under ./download/" }
          $totalMB = [math]::Round(($found | Measure-Object Length -Sum).Sum / 1MB, 2)
          Write-Host "✅ $($found.Count) artifact(s), total $totalMB MB"
          $found | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Download (url)
        if: steps.vars.outputs.mode == 'url'
        shell: pwsh
        run: |
          $url = "${{ inputs.source }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) { throw "source is empty" }
          New-Item -ItemType Directory -Force download | Out-Null

          $uri = [System.Uri]$url
          $name = [System.IO.Path]::GetFileName($uri.AbsolutePath)
          if ([string]::IsNullOrWhiteSpace($name)) { $name = "payload-$(Get-Date -Format yyyyMMddHHmmss).bin" }
          # 白名单清洗，顺带挡掉 URL 路径里的 ../
          $name = ($name -replace '[^a-zA-Z0-9_.+-]', '_')
          $dest = "download\$name"

          Write-Host "GET $url"
          Write-Host "-> $dest"

          # curl.exe（Win10+ 自带）：GB 级文件比 Invoke-WebRequest 快 5-10 倍
          # --fail 让 4xx/5xx 变成非 0 退出；--retry 顶住抖动；--max-time 顶住慢速 hang
          $curlArgs = @('-sSL', '--fail', '--retry', '3', '--retry-delay', '2',
                        '--connect-timeout', '30', '--max-time', '3600',
                        '-o', $dest, $url)
          Write-Host "Invoking: curl.exe $($curlArgs -join ' ')"
          $PSNativeCommandArgumentPassing = 'Standard'
          & curl.exe @curlArgs
          if ($LASTEXITCODE -ne 0) { throw "curl failed (exit=$LASTEXITCODE)" }

          # 防 server 200 OK 返回 HTML 错误页被当成产物
          $file = Get-Item $dest
          $size = [int64]$file.Length
          Write-Host "Downloaded: $($file.Name) ($size bytes, $([math]::Round($size/1MB,2)) MB)"
          if ($size -le 0) { throw "downloaded file is empty (0 bytes)" }
          if ($size -lt 1KB) {
            $headBytes = Get-Content $dest -AsByteStream -TotalCount 512 -ErrorAction SilentlyContinue
            if ($headBytes) {
              $headText = [System.Text.Encoding]::UTF8.GetString($headBytes)
              if ($headText -match '(?i)<!DOCTYPE\s+html|<html[\s>]|<title>.*(error|not found|403|404)') {
                $preview = $headText.Substring(0, [math]::Min(300, $headText.Length)) -replace '\s+', ' '
                throw "downloaded '$name' ($size B) looks like an HTML error page, not the requested file. Preview: $preview"
              }
            }
          }

      - name: Compress + split
        shell: pwsh
        env:
          ZIP_LEVEL: ${{ inputs.zip_level }}
        run: |
          # 必须设：Legacy arg passing 会把 `-mx=0` 这类带 = 的 arg 隐式 quote，7z 解析不出来会静默降级
          $PSNativeCommandArgumentPassing = 'Standard'

          $pkg  = "${{ steps.vars.outputs.pkg }}"
          $sz   = "C:\Program Files\7-Zip\7z.exe"
          $volMB = 0
          if (-not [int]::TryParse("${{ inputs.volume_size_mb }}", [ref]$volMB) -or $volMB -le 0) {
            throw "volume_size_mb 必须是正整数（收到 '${{ inputs.volume_size_mb }}'）"
          }

          # zip_level 白名单映射；choice 之外仍可能是 API 传进来的任意串，故不信任表单
          $lvl = if ([string]::IsNullOrWhiteSpace($env:ZIP_LEVEL)) { 'store' } else { $env:ZIP_LEVEL.Trim().ToLower() }
          $zipFlags = switch ($lvl) {
            'store'    { @('-mx0') }
            'fast'     { @('-mx1', '-mmt=on') }
            'balanced' { @('-mx5', '-mmt=on') }
            'high'     { @('-mx9', '-mmt=on') }
            default    { throw "未知 zip_level '$env:ZIP_LEVEL'；期望 store|fast|balanced|high" }
          }

          function Invoke-7z {
            param([string[]]$Arguments, [string]$Label)
            $quotedArgs = ($Arguments | ForEach-Object { '"' + $_ + '"' }) -join ' '
            $cmdLine = '"' + $sz + '" ' + $quotedArgs
            Write-Host "[$Label] $cmdLine"
            $o = & $sz @Arguments 2>&1 | Out-String
            $c = $LASTEXITCODE
            Write-Host "[$Label] exit=$c"
            Write-Host $o
            if ($c -ge 2) { throw "$Label failed (exit=$c)" }
            if ($c -eq 1) { Write-Host "::warning::[$Label] 7z returned warnings (exit=1)" }
          }

          # ---- 第一层：./download -> $pkg.zip（档位由 zip_level 决定；wheel 已自带 deflate，档位越高收益越小）----
          if (Test-Path "$pkg.zip") { Remove-Item -Force "$pkg.zip" }
          $srcDir = ".\download"
          if (-not (Test-Path $srcDir)) { throw "$srcDir 不存在；前一步下载没产出" }
          $srcFiles = @(Get-ChildItem $srcDir -Recurse -File)
          if ($srcFiles.Count -eq 0) { throw "$srcDir 是空目录；前一步下载没产出" }
          $srcArg = "$srcDir\*"

          $rawBytes = [int64](($srcFiles | Measure-Object Length -Sum).Sum)
          Invoke-7z -Label 'inner' -Arguments (@('a', '-tzip') + $zipFlags + @('-y', "$pkg.zip", $srcArg))

          $inner = [int64](Get-Item "$pkg.zip").Length
          if ($inner -le 64) { throw "inner zip is suspiciously small ($inner bytes)" }
          $ratio = if ($rawBytes -gt 0) { [math]::Round($inner * 100 / $rawBytes, 2) } else { 0 }
          Write-Host "Inner zip: $rawBytes -> $inner bytes ($ratio %), level=$lvl"
          Write-Host "---- 7z l $pkg.zip ----"
          & $sz l "$pkg.zip"

          # ---- 分卷大小决策；依赖外层 store（outer ≈ inner + 150B 头开销）----
          #   2*vol = inner + 4096 >= outer  ⇒ 不超过 2 卷
          #   vol = inner/2 + 2048 < outer   ⇒ 至少 2 卷
          $userVolBytes = [int64]$volMB * 1MB
          $partsIfUser  = [math]::Ceiling($inner / $userVolBytes)
          if ($partsIfUser -ge 2) {
            $volArg = "-v${volMB}m"
            Write-Host "Volume: ${volMB} MB  (将切 ~${partsIfUser} 卷)"
          } else {
            if ($inner -lt 4096) {
              Write-Host "::warning::inner=$inner bytes < 4KB，自校正公式不严格保证 2 卷；继续。"
            }
            $volBytes = [math]::Max(1, [int64][math]::Ceiling(($inner + 4096) / 2))
            $volArg = "-v${volBytes}b"
            Write-Host "Auto-shrink: 用户 ${volMB}MB -> ${volBytes} bytes (强制 2 卷，第二卷会略小)"
          }

          # ---- 第二层：分卷。外层必须 -mx0：一压缩 outer 就 < inner，上面的"至少 2 卷"推导失效，
          #      会静默退化成单卷；且 store 让各卷字节独立、拼接即可解。----
          @("$pkg.outer.7z", "$pkg.outer.7z.[0-9]*", "$pkg.outer.7z.[0-9]*.7z") | ForEach-Object {
            Get-ChildItem $_ -ErrorAction SilentlyContinue | Remove-Item -Force
          }
          Invoke-7z -Label 'outer' -Arguments @('a', '-t7z', '-mx0', '-y', $volArg, "$pkg.outer.7z", "$pkg.zip")

          # ASSERT：outer 必须恰好含 1 个条目 = $pkg.zip
          Write-Host "---- 7z l $pkg.outer.7z.001 ----"
          $listing = (& $sz l "$pkg.outer.7z.001" 2>&1) | Out-String
          Write-Host $listing
          $expectedEntry = "$pkg.zip"
          if ($listing -notmatch [regex]::Escape($expectedEntry)) {
            throw "outer archive does NOT contain expected entry '$expectedEntry'. See listing above."
          }
          # summary 行也以日期开头但 Attr 列是空白，用 [A-Z.]{5} 区分以免假阳性
          $entryLines = @($listing -split "`r?`n" | Where-Object {
            $_ -match '^\s*\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+[A-Z.]{5}\s+\d+\s+\d+\s+\S'
          })
          if ($entryLines.Count -ne 1) {
            $joined = $entryLines -join "`n"
            throw "outer archive should have exactly 1 entry but has $($entryLines.Count):`n$joined"
          }
          if ($entryLines[0] -notmatch [regex]::Escape($expectedEntry) + '\s*$') {
            throw "outer archive's entry doesn't end with '$expectedEntry': $($entryLines[0])"
          }
          if ($entryLines[0] -match '\.(whl|tar\.gz|egg)\b') {
            throw "outer archive's single entry looks like a raw wheel/sdist, not the inner zip: $($entryLines[0])"
          }

          # 防火墙只放行 .7z -> 给每卷追加一层 .7z；@() 先 materialize 再改名
          @(Get-ChildItem "$pkg.outer.7z.[0-9]*") | Where-Object { $_.Name -notlike '*.7z.7z' } | ForEach-Object {
            Rename-Item $_.FullName -NewName "$($_.Name).7z"
          }

          # 删掉内层 .zip，避免 release 误上传
          Remove-Item -Force "$pkg.zip"

          Write-Host "---- final volumes ----"
          Get-ChildItem "$pkg.outer.7z.[0-9]*.7z" | Select-Object Name, Length, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: false
          body: |
            ```
            ${{ inputs.source }}
            zip_level: ${{ inputs.zip_level }}
            ```
          files: |
            ${{ steps.vars.outputs.pkg }}.outer.7z.*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
