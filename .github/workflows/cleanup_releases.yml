name: "🧹 Release & Tag 全倉庫大掃除"

on:
  workflow_dispatch: # 現在直接點擊即可運行，無需輸入任何值

jobs:
  total-wipeout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 [1/4] 檢出倉庫代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 [2/4] 資源普查：掃描當前 Release 與 Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==== [SCANNING RESOURCES] ===="
          RELEASE_COUNT=$(gh release list --limit 1000 | wc -l)
          TAG_COUNT=$(git tag | wc -l)
          
          echo "📦 當前 Release 總數: $RELEASE_COUNT"
          echo "🏷️ 當前 Tag 總數: $TAG_COUNT"
          
          if [ "$TAG_COUNT" -eq 0 ] && [ "$RELEASE_COUNT" -eq 0 ]; then
            echo "✅ 倉庫已經非常乾淨，無需進一步清理。"
            exit 0
          fi

      - name: 💣 [3/4] 執行物理刪除：清空所有 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "==== [WIPEOUT START] ===="
          RELEASES=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          
          if [ -z "$RELEASES" ]; then
            echo "💡 未發現任何 Release，跳過此步驟。"
          else
            for tag in $RELEASES; do
              echo "▶️ 正在抹除 Release：$tag ..."
              # --cleanup-tag 會連同對應的 Git Tag 一併刪除
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            done
          fi

      - name: 🧹 [4/4] 深度清理：掃除殘留孤立 Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==== [FINAL SWEEP] ===="
          # 獲取本地所有剩餘 Tag
          REMOTE_TAGS=$(git tag)
          
          if [ -z "$REMOTE_TAGS" ]; then
            echo "✅ 所有 Tag 已清理完畢。"
          else
            for rtag in $REMOTE_TAGS; do
              echo "🗑️ 正在刪除殘留 Tag：$rtag ..."
              # 優先嘗試通過 Git 推送刪除，失敗則調用 API 強制刪除
              git push origin --delete "$rtag" || gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$rtag"
            done
          fi
          
          echo -e "\n==== [🎉 CLEANUP COMPLETE] ===="
          echo "倉庫已恢復至初始乾淨狀態。"
