name: "🚀 GGUF Extreme Manual Parallel Relay"

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '目标 GGUF 下载地址'
        required: true

jobs:
  parallel-relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 [1/4] 环境检查与工具安装
        run: |
          echo "==== [SYSTEM INFO] ===="
          echo "处理器: $(nproc) 核 | 内存: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "可用磁盘空间:"
          df -h / | grep /
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          echo "✅ 工具安装完成。"

      - name: ⚡ [2/4] 多线程断点续传下载
        run: |
          echo "==== [DOWNLOAD START] ===="
          aria2c -x 16 -s 16 -k 1M --console-log-level=notice --file-allocation=none \
          "${{ github.event.inputs.model_url }}" -o "raw.gguf"
          echo -e "\n✅ 下载完成: $(ls -lh raw.gguf)"

      - name: 🔪 [3/4] 极限切割 (2GB-1B)
        run: |
          echo "==== [SPLIT START] ===="
          RAW="raw.gguf"
          CHUNK_BYTES=2147483647
          FILE_SIZE=$(stat -c%s "$RAW")
          TOTAL=$(( (FILE_SIZE + CHUNK_BYTES - 1) / CHUNK_BYTES ))
          TOTAL_PAD=$(printf "%05d" $TOTAL)
          
          split -b $CHUNK_BYTES -d -a 5 --numeric-suffixes=1 \
                --additional-suffix="-of-$TOTAL_PAD.gguf" \
                "$RAW" "model-"
          rm "$RAW"
          echo "✅ 已切割为 $TOTAL 个分段。"
          ls -lh model-*.gguf

      - name: 🚢 [4/4] 手动并发上传 (6 线程 + 独立重试)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "==== [UPLOAD START] ===="
          TAG="relay-${{ github.run_id }}"
          gh release create "$TAG" --repo "$REPO" --title "Relay: $(date +'%H:%M')" --notes "Source: ${{ github.event.inputs.model_url }}"

          # 并发上传函数
          upload_with_retry() {
            local file=$1
            local attempt=1
            local max_retries=5
            
            while [ $attempt -le $max_retries ]; do
              echo "▶️ [File: $file] 尝试上传 $attempt/$max_retries"
              if gh release upload "$TAG" "$file" --repo "$REPO" --clobber; then
                echo "✅ [File: $file] 上传成功！"
                return 0
              else
                echo "⚠️ [File: $file] 失败，等待重试..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
              fi
            done
            echo "🚨 [File: $file] 最终上传失败！"
            return 1
          }

          export -f upload_with_retry
          
          # 手动控制并发：最多同时运行 6 个后台任务
          MAX_JOBS=6
          COUNT=0
          
          for f in model-*.gguf; do
            # 运行上传并放入后台
            upload_with_retry "$f" &
            COUNT=$((COUNT + 1))
            
            # 当后台任务数达到 MAX_JOBS 时，等待其中一个完成
            if [[ $(jobs -r | wc -l) -ge $MAX_JOBS ]]; then
              wait -n
            fi
          done

          # 等待所有剩余后台任务完成
          wait
          echo "==== [ALL PROCESSES FINISHED] ===="
