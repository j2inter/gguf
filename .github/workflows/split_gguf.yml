name: GGUF-Extreme-Relay

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: 'Target GGUF URL'
        required: true

jobs:
  extreme-relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: High-Speed Download
        run: |
          aria2c -x 16 -s 16 -k 1M --console-log-level=warn --file-allocation=none \
          "${{ github.event.inputs.model_url }}" -o "raw.gguf"

      - name: Max-Size Split
        run: |
          RAW="raw.gguf"
          CHUNK_BYTES=2147483647
          FILE_SIZE=$(stat -c%s "$RAW")
          TOTAL=$(( (FILE_SIZE + CHUNK_BYTES - 1) / CHUNK_BYTES ))
          TOTAL_PAD=$(printf "%05d" $TOTAL)
          
          split -b $CHUNK_BYTES -d -a 5 --numeric-suffixes=1 \
                --additional-suffix="-of-$TOTAL_PAD.gguf" \
                "$RAW" "model-"
          rm "$RAW"

      - name: Reliable Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 提前定义变量，减少后面命令的复杂度
          REPO: ${{ github.repository }}
        run: |
          TAG="relay-${{ github.run_id }}"
          
          # 显式指定 --repo，这样就不需要 git init 或 checkout
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Relay: $(date +'%Y-%m-%d')" \
            --notes "Source: ${{ github.event.inputs.model_url }}"
          
          MAX_RETRIES=5
          ATTEMPT=1
          SUCCESS=false
          
          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "Attempt $ATTEMPT..."
            # 同样在上传时显式指定 --repo
            if gh release upload "$TAG" model-*.gguf --repo "$REPO" --clobber; then
              echo "Upload Success"
              SUCCESS=true
              break
            else
              echo "Upload failed, retrying in $((ATTEMPT * 5))s..."
              sleep $((ATTEMPT * 5))
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "Final attempt failed."
            exit 1
          fi
