name: "🚀 GGUF Extreme Pro: Perfect Naming"

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '目标 GGUF 下载地址'
        required: true

jobs:
  pro-relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 [1/4] 环境检查与工具安装
        run: |
          echo "==== [SYSTEM INFO] ===="
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          echo "✅ 工具安装完成。"

      - name: ⚡ [2/4] 智能提取名称与多线程下载
        run: |
          echo "==== [DOWNLOAD START] ===="
          URL="${{ github.event.inputs.model_url }}"
          
          # 1. 提取原始文件名并剔除 URL 参数
          RAW_NAME=$(basename "${URL%%?*}")
          
          # 2. 彻底剥离 .gguf 后缀 (用于前缀命名)
          # 这样 Llama.gguf 就会变成 Llama
          BASE_NAME="${RAW_NAME%.*}"
          
          echo "原始完整名: $RAW_NAME"
          echo "纯净前缀名: $BASE_NAME"
          
          # 存入环境变量
          echo "RAW_NAME=$RAW_NAME" >> $GITHUB_ENV
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
          echo "CST_TIME=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          
          # 3. 开始并行下载
          aria2c -x 16 -s 16 -k 1M --console-log-level=notice --file-allocation=none \
          "$URL" -o "$RAW_NAME"
          
          echo -e "\n✅ 下载完成: $(ls -lh "$RAW_NAME")"

      - name: 🔪 [3/4] 极限切割 (2GB-1B)
        run: |
          echo "==== [SPLIT START] ===="
          RAW="${{ env.RAW_NAME }}"
          BASE="${{ env.BASE_NAME }}"
          CHUNK_BYTES=2147483647
          
          FILE_SIZE=$(stat -c%s "$RAW")
          TOTAL=$(( (FILE_SIZE + CHUNK_BYTES - 1) / CHUNK_BYTES ))
          TOTAL_PAD=$(printf "%05d" $TOTAL)
          
          echo "执行切割: $RAW -> ${BASE}-XXXXX-of-${TOTAL_PAD}.gguf"
          
          # 核心改动：前缀用 BASE，后缀用 .gguf
          split -b $CHUNK_BYTES -d -a 5 --numeric-suffixes=1 \
                --additional-suffix="-of-$TOTAL_PAD.gguf" \
                "$RAW" "$BASE-"
          
          rm "$RAW"
          echo "✅ 切割完成。分段示例: $(ls model-* 2>/dev/null | head -n 1 || ls ${BASE}-* | head -n 1)"
          ls -lh "${BASE}-"*

      - name: 🚢 [4/4] 智能命名上传 (6 并发 + 独立重试)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RAW_NAME: ${{ env.RAW_NAME }}
          BASE_NAME: ${{ env.BASE_NAME }}
          CST_TIME: ${{ env.CST_TIME }}
        run: |
          echo "==== [UPLOAD START] ===="
          
          # Release 标签：纯净文件名 + 时间
          TAG="${BASE_NAME}-${CST_TIME}"
          
          gh release create "$TAG" --repo "$REPO" \
            --title "Relay: $BASE_NAME ($CST_TIME)" \
            --notes "Source: ${{ github.event.inputs.model_url }}"

          upload_with_retry() {
            local file=$1
            local tag=$2
            local repo=$3
            local attempt=1
            while [ $attempt -le 5 ]; do
              echo "▶️ [$file] 尝试 $attempt/5"
              if gh release upload "$tag" "$file" --repo "$repo" --clobber; then
                echo "✅ [$file] 成功"
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }
          export -f upload_with_retry
          
          # 并发处理
          MAX_JOBS=6
          for f in "${BASE_NAME}-"*; do
            upload_with_retry "$f" "$TAG" "$REPO" &
            if [[ $(jobs -r | wc -l) -ge $MAX_JOBS ]]; then wait -n; fi
          done

          wait
          echo -e "\n==== [🎉 中转完成] ===="
          echo "链接: https://github.com/$REPO/releases/tag/$TAG"
