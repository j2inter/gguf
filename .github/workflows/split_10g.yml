name: ✂️ GGUF Pro Split & Download 🚀 (No Zip)

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '大模型 GGUF 直链地址'
        required: true
        type: string
      split_size_mb:
        description: '每个分卷的大小 (单位: MB)'
        required: true
        default: '7000'
        type: choice
        options:
          - '2000'
          - '4000'
          - '7000'
          - '8000'
          - '9500'

jobs:
  split-and-upload:
    runs-on: ubuntu-latest # 拥有 70GB 磁盘空间
    steps:
      - name: 1. 安装下载工具 (aria2) 🛠️
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: 2. 获取预编译 llama-gguf-split 工具 (最新版) 🦙
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "正在从官方 Release 下载 Ubuntu 预编译包..."
          # 自动下载最新的 ubuntu-x64 tar.gz 包
          gh release download --repo ggerganov/llama.cpp --pattern "*ubuntu-x64.tar.gz"
          
          mkdir llama_bin
          tar -xzf *ubuntu-x64.tar.gz -C llama_bin
          
          # 寻找二进制文件并移动到根目录
          find llama_bin -name "llama-gguf-split" -type f -exec cp {} ./ \;
          chmod +x ./llama-gguf-split
          rm -rf llama_bin *.tar.gz

      - name: 3. 解析文件名并多线程下载 📥
        run: |
          URL="${{ github.event.inputs.model_url }}"
          # 智能提取文件名
          RAW_NAME=$(basename "${URL%%\?*}")
          if [ -z "$RAW_NAME" ]; then RAW_NAME="model.gguf"; fi
          BASE_NAME="${RAW_NAME%.*}"
          
          echo "RAW_NAME=$RAW_NAME" >> $GITHUB_ENV
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV

          echo "🚀 开始多线程下载 $RAW_NAME (启用磁盘预分配)..."
          aria2c -x 16 -s 16 -j 16 -k 10M --file-allocation=falloc \
                 --console-log-level=warn --summary-interval=10 -o "$RAW_NAME" "$URL"

      - name: 4. 张量级分割模型 🧠
        run: |
          # 将 MB 转换为 llama-gguf-split 识别的单位
          SPLIT_SIZE="${{ github.event.inputs.split_size_mb }}M"
          echo "🧠 分割尺寸设定为: $SPLIT_SIZE"
          
          ./llama-gguf-split --split --split-max-size "$SPLIT_SIZE" "$RAW_NAME" "$BASE_NAME"
          
          # 删除原始 14GB 大文件腾出空间
          rm "$RAW_NAME"
          
          # 扫描生成的分卷并存入环境变量，方便后续 Step 判断
          echo "FILE_P1=$(ls ${BASE_NAME}-00001-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P2=$(ls ${BASE_NAME}-00002-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P3=$(ls ${BASE_NAME}-00003-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P4=$(ls ${BASE_NAME}-00004-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P5=$(ls ${BASE_NAME}-00005-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV

      - name: 5a. 上传分卷 1 📤
        if: env.FILE_P1 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P1 }}
          path: ${{ env.FILE_P1 }}
          archive: false

      - name: 5b. 上传分卷 2 📤
        if: env.FILE_P2 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P2 }}
          path: ${{ env.FILE_P2 }}
          archive: false

      - name: 5c. 上传分卷 3 📤
        if: env.FILE_P3 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P3 }}
          path: ${{ env.FILE_P3 }}
          archive: false

      - name: 5d. 上传分卷 4 📤
        if: env.FILE_P4 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P4 }}
          path: ${{ env.FILE_P4 }}
          archive: false

      - name: 5e. 上传分卷 5 📤
        if: env.FILE_P5 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P5 }}
          path: ${{ env.FILE_P5 }}
          archive: false
