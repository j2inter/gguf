name: ✂️ GGUF Pro Split & Download 🚀 (No Zip)

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '大模型 GGUF 直链地址'
        required: true
        type: string
      split_size_mb:
        description: '请选择或输入分卷大小 (单位: MB)'
        required: true
        default: '8000'
        type: choice
        options:
          - '2000'
          - '4000'
          - '7000'
          - '8000'
          - '9500'

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 准备依赖库 (aria2) 🛠️
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: 获取官方预编译的 llama.cpp 工具 🦙
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "正在拉取官方预编译版本..."
          gh release download --repo ggerganov/llama.cpp --pattern "*ubuntu-x64.zip"
          unzip -q *ubuntu-x64.zip -d llama_bin
          find llama_bin -name "llama-gguf-split" -type f -exec cp {} ./ \;
          chmod +x ./llama-gguf-split
          rm -rf llama_bin *.zip

      - name: 解析文件名并多线程下载 📥
        run: |
          URL="${{ github.event.inputs.model_url }}"
          RAW_NAME=$(basename "${URL%%\?*}")
          if [ -z "$RAW_NAME" ]; then RAW_NAME="model.gguf"; fi
          BASE_NAME="${RAW_NAME%.*}"
          
          echo "RAW_NAME=$RAW_NAME" >> $GITHUB_ENV
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV

          echo "🚀 开始使用 aria2 拉取..."
          aria2c -x 16 -s 16 -j 16 -k 10M --file-allocation=falloc \
                 --console-log-level=warn --summary-interval=10 -o "$RAW_NAME" "$URL"

      - name: 张量级动态分割模型 🧠
        run: |
          # 获取用户选择的大小并附加上 M 单位
          SPLIT_SIZE="${{ github.event.inputs.split_size_mb }}M"
          echo "🧠 分割尺寸设定为: $SPLIT_SIZE"
          
          ./llama-gguf-split --split --split-max-size "$SPLIT_SIZE" "$RAW_NAME" "$BASE_NAME"
          rm "$RAW_NAME"

      # 使用通配符批量上传，配合 archive: false 
      # 注意：如果分卷过多（例如超过10个），建议通过 shell 循环上传
      # 这里我们通过模式匹配动态上传所有生成的 .gguf 分卷
      - name: 上传所有生成的分卷 (免压缩) 📤
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BASE_NAME }}_parts
          path: ./${{ env.BASE_NAME }}-*.gguf
          # 核心：根据你的新功能说明，设为 false 绕过 zip
          archive: false
