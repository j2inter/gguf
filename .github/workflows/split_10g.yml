name: Split and Download GGUF (No Zip)

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '14GB GGUF 文件的下载链接'
        required: true
        type: string

jobs:
  split-and-upload:
    # 确保使用你那台 70GB 空间的 Runner
    runs-on: ubuntu-latest 
    steps:
      - name: Download Original GGUF
        run: |
          echo "正在下载 14GB 模型..."
          wget -q --show-progress -O large_model.gguf "${{ github.event.inputs.model_url }}"

      - name: Split GGUF File
        run: |
          echo "正在分割文件..."
          # 将 14GB 分割为两个 7GB 的块
          # split 会生成 part_aa 和 part_ab
          split -b 7G large_model.gguf part_
          
          # 重命名为符合公司要求的 .gguf 后缀
          mv part_aa model_part1.gguf
          mv part_ab model_part2.gguf
          
          # 验证文件大小
          ls -lh *.gguf

      - name: Upload Part 1 (No Compression)
        uses: actions/upload-artifact@v7
        with:
          name: model_part1.gguf
          path: model_part1.gguf
          # 关键新特性：不打包成 zip，直接上传原文件
          archive: false

      - name: Upload Part 2 (No Compression)
        uses: actions/upload-artifact@v7
        with:
          name: model_part2.gguf
          path: model_part2.gguf
          # 关键新特性：不打包成 zip，直接上传原文件
          archive: false
