name: Fast Split and Download GGUF (No Zip)

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '14GB GGUF 文件的直接下载链接'
        required: true
        type: string
      model_basename:
        description: '模型基础名称 (不要带 .gguf 后缀，例如: my-custom-model)'
        required: true
        type: string
        default: 'model'

jobs:
  split-and-upload:
    # ⚠️ 确保填写你的 70GB runner 标签，例如: self-hosted
    runs-on: ubuntu-latest 
    steps:
      - name: Install aria2 for Multi-threaded Download
        run: |
          echo "正在安装 aria2..."
          sudo apt-get update -qq
          sudo apt-get install -y aria2

      - name: Multi-threaded Download GGUF
        run: |
          echo "正在使用 16 线程下载模型..."
          # -x 16: 开启 16 个连接; -s 16: 文件切分成 16 块同时下载; -k 1M: 最小分片大小; -c: 断点续传
          aria2c -x 16 -s 16 -k 1M -c "${{ github.event.inputs.model_url }}" -o "${{ github.event.inputs.model_basename }}.gguf"

      - name: Split GGUF with Standard Llama.cpp Naming
        run: |
          echo "正在分割文件并应用 GGUF 标准命名..."
          BASENAME="${{ github.event.inputs.model_basename }}"
          
          # 以 7500MB(7.5GB) 为单位分割文件
          # --numeric-suffixes=1 -a 5 会自动生成后缀为 00001, 00002 的分块文件
          split -b 7500M "${BASENAME}.gguf" chunk_ --numeric-suffixes=1 -a 5
          
          # 重命名为 llama.cpp 官方支持的分割命名格式
          mv chunk_00001 "${BASENAME}-00001-of-00002.gguf"
          mv chunk_00002 "${BASENAME}-00002-of-00002.gguf"
          
          echo "✅ 分割完成，文件列表："
          ls -lh *.gguf

      - name: Upload Part 1
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.model_basename }}-00001-of-00002.gguf
          path: ${{ github.event.inputs.model_basename }}-00001-of-00002.gguf
          archive: false # 核心！拒绝 zip 打包，直接提供 .gguf 原文件

      - name: Upload Part 2
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.model_basename }}-00002-of-00002.gguf
          path: ${{ github.event.inputs.model_basename }}-00002-of-00002.gguf
          archive: false # 同上
