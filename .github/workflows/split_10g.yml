name: 👑 GGUF Pro Split & Download 🚀 (No Zip)

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '大模型 GGUF 直链地址'
        required: true
        type: string
      split_size_mb:
        description: '每个分卷的大小 (单位: MB)'
        required: true
        default: '7000'
        type: choice
        options:
          - '2000'
          - '4000'
          - '7000'
          - '8000'
          - '9500'

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装下载工具 (aria2) 🛠️
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: 2. 获取预编译工具及依赖库 🦙
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "正在下载官方预编译包..."
          gh release download --repo ggerganov/llama.cpp --pattern "*ubuntu-x64.tar.gz"
          
          # 【修复点1】：解压到专属文件夹，保留原汁原味的符号链接和目录结构
          mkdir llama_release
          tar -xzf *ubuntu-x64.tar.gz -C llama_release
          rm *.tar.gz
          
          # 【修复点2】：智能动态查找二进制程序和库文件的目录，不怕官方以后改目录名字
          SPLIT_BIN=$(find ./llama_release -name "llama-gguf-split" | head -n 1)
          LIB_DIR=$(dirname $(find ./llama_release -name "libllama-common.so*" | head -n 1))
          
          # 赋予执行权限
          chmod +x "$SPLIT_BIN"
          
          echo "工具路径: $SPLIT_BIN"
          echo "依赖库目录: $LIB_DIR"
          
          # 存入环境变量，传递给后续步骤
          echo "SPLIT_BIN=$SPLIT_BIN" >> $GITHUB_ENV
          echo "LIB_DIR=$LIB_DIR" >> $GITHUB_ENV

      - name: 3. 解析文件名并多线程下载 📥
        run: |
          URL="${{ github.event.inputs.model_url }}"
          RAW_NAME=$(basename "${URL%%\?*}")
          if [ -z "$RAW_NAME" ]; then RAW_NAME="model.gguf"; fi
          BASE_NAME="${RAW_NAME%.*}"
          
          echo "RAW_NAME=$RAW_NAME" >> $GITHUB_ENV
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV

          echo "🚀 开始多线程下载..."
          aria2c -x 16 -s 16 -j 16 -k 10M --file-allocation=falloc \
                 --console-log-level=warn --summary-interval=10 -o "$RAW_NAME" "$URL"

      - name: 4. 张量级分割模型 🧠
        run: |
          SPLIT_SIZE="${{ github.event.inputs.split_size_mb }}M"
          
          # 【修复点3】：指定库文件搜索路径为我们刚找到的、含有完整软链接的目录
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ env.LIB_DIR }}
          
          echo "🧠 开始执行分割，尺寸: $SPLIT_SIZE"
          # 使用绝对路径调用工具
          ${{ env.SPLIT_BIN }} --split --split-max-size "$SPLIT_SIZE" "$RAW_NAME" "$BASE_NAME"
          
          rm "$RAW_NAME"
          
          echo "FILE_P1=$(ls ${BASE_NAME}-00001-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P2=$(ls ${BASE_NAME}-00002-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P3=$(ls ${BASE_NAME}-00003-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P4=$(ls ${BASE_NAME}-00004-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "FILE_P5=$(ls ${BASE_NAME}-00005-of-*.gguf 2>/dev/null || echo '')" >> $GITHUB_ENV

      - name: 5a. 上传分卷 1 📤
        if: env.FILE_P1 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P1 }}
          path: ${{ env.FILE_P1 }}
          archive: false

      - name: 5b. 上传分卷 2 📤
        if: env.FILE_P2 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P2 }}
          path: ${{ env.FILE_P2 }}
          archive: false

      - name: 5c. 上传分卷 3 📤
        if: env.FILE_P3 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P3 }}
          path: ${{ env.FILE_P3 }}
          archive: false

      - name: 5d. 上传分卷 4 📤
        if: env.FILE_P4 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P4 }}
          path: ${{ env.FILE_P4 }}
          archive: false

      - name: 5e. 上传分卷 5 📤
        if: env.FILE_P5 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE_P5 }}
          path: ${{ env.FILE_P5 }}
          archive: false
