name: Multi-thread Remote File Splitter

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: '远程文件的 URL'
        required: true
        type: string

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Multi-thread Download File
        run: |
          echo "正在使用 aria2 多线程下载: ${{ inputs.file_url }}"
          # -x 16: 单个服务器最大连接数为 16
          # -s 16: 将文件分成 16 个片段同时下载
          # -k 1M: 文件片段的最小大小
          # -c: 支持断点续传
          aria2c -x 16 -s 16 -k 1M -c -d . -o "large_file.tmp" "${{ inputs.file_url }}"

      - name: Split File
        run: |
          echo "开始按 10GB 物理切割文件..."
          mkdir -p ./output
          split -b 10G -d "large_file.tmp" "./output/part_"
          rm "large_file.tmp" # 切割完立刻删除原文件以释放空间

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: split-files
          path: ./output/
          retention-days: 1
