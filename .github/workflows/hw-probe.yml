              GPU_DESC="检测到 GPU：$CHIP"
            fi
          else
            emit ""
            emit "### Linux：PCI 显示设备"
            if command -v lspci >/dev/null 2>&1; then
              LSPCI_GPU="$(lspci 2>/dev/null | grep -iE 'vga|3d|display' || true)"
              if [ -n "$LSPCI_GPU" ]; then
                emit '```text'
                printf '%s\n' "$LSPCI_GPU" >> "$F"
                emit '```'
