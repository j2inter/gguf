name: "🖥️ 硬件配置 / 性能 / 软件环境探测"

# 跨 Linux / Windows / macOS 三类 GitHub 托管 runner 采集硬件配置、跑微基准、清点软件环境，
# 每个平台产出完整 Markdown 报告 artifact，最后由 report job 合并成一张跨平台对比表写进 Run Summary。
#
# 公开仓库的标准 runner 分钟数免费无限量，可放心跑满矩阵。
# 手动触发时可自定义 runner 标签，把 arm64 也纳入对比：
#   ubuntu-latest,windows-latest,macos-latest,ubuntu-24.04-arm,windows-11-arm,macos-15-intel

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: '要探测的 runner 标签，逗号分隔（支持 arm64 / intel 机型，见 validate job）'
        required: false
        default: 'ubuntu-latest,windows-latest,macos-latest'
      bench_seconds:
        description: '每项基准测试的时间预算（秒）。越大越稳，也越慢'
        required: false
        default: '3'
      disk_mb:
        description: '磁盘基准测试文件大小 (MB)。受 runner 14GB 磁盘限制'
        required: false
        default: '1024'
      bench_workers:
        description: '多核基准的并行进程数，0 = 全部逻辑核'
        required: false
        default: '0'
      probe_net:
        description: '是否测试网络（DNS / TCP / TLS / HTTP 吞吐）'
        required: false
        type: boolean
        default: true
      native_bench:
        description: '是否额外跑原生工具交叉验证（Linux/macOS sysbench，Windows 7z b）'
        required: false
        type: boolean
        default: true
      upload_artifacts:
        description: '是否上传每平台完整报告 artifact'
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/hw-probe.yml'
      - 'scripts/hw_bench.py'
      - 'scripts/merge_report.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hw-probe.yml'
      - 'scripts/hw_bench.py'
      - 'scripts/merge_report.py'
  schedule:
    # 每周一 04:00 UTC，用默认三平台留一份周期性基线。不需要就删掉这段
    - cron: '0 4 * * 1'

# 只读就够了：本 workflow 只采集信息、只发 artifact，不推任何东西
permissions:
  contents: read

# 同一分支的重复触发直接取消旧的，省时间。matrix 各平台之间互不取消
concurrency:
  group: hw-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "✅ 参数与标签预检"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 输入统一走 env 注入，不在 shell 里直接内插 ${{ }}，避免脚本注入
    env:
      IN_LABELS: ${{ github.event.inputs.runner_labels || 'ubuntu-latest,windows-latest,macos-latest' }}
      IN_SECONDS: ${{ github.event.inputs.bench_seconds || '3' }}
      IN_DISK_MB: ${{ github.event.inputs.disk_mb || '1024' }}
      IN_WORKERS: ${{ github.event.inputs.bench_workers || '0' }}
    # GitHub Actions 表达式里没有 replace()，也没有任何字符串切分函数，
    # 所以矩阵必须在这里用 bash 生成好再以 JSON 输出给 probe job
    outputs:
      matrix: ${{ steps.labels.outputs.matrix }}
      count: ${{ steps.labels.outputs.count }}
    steps:
      - name: 🏷️ 校验 runner 标签并生成矩阵
        id: labels
        shell: bash
        run: |
          set -euo pipefail
          LABELS="$IN_LABELS"

          # 2026-09 公开仓库可用的标准 runner 标签（分钟数免费无限量）
          ALLOWED="ubuntu-latest ubuntu-24.04 ubuntu-22.04 ubuntu-26.04 ubuntu-slim
          ubuntu-24.04-arm ubuntu-22.04-arm ubuntu-26.04-arm
          windows-latest windows-2025 windows-2025-vs2026 windows-2022
          windows-11-arm windows-11-vs2026-arm
          macos-latest macos-14 macos-15 macos-26 macos-15-intel macos-26-intel xcode-27"

          echo "输入标签: $LABELS"
          if [[ "$LABELS" =~ [\"\'] ]]; then
            echo "::error::runner_labels 含引号，无法安全生成 JSON 矩阵，请只用逗号分隔的标签"
            exit 1
          fi

          IFS=',' read -ra RAW <<< "$LABELS"
          CLEAN=()
          for raw in "${RAW[@]}"; do
            L="$(echo "$raw" | tr -d '[:space:]')"       # trim 掉首尾空格
            [[ -z "$L" ]] && continue                     # 容忍尾随逗号
            if ! grep -qwF "$L" <<< "$ALLOWED"; then
              echo "::error::不支持的标签 '$L'。可用标签：$(echo "$ALLOWED" | xargs)"
              exit 1
            fi
            # 去重保序，避免手写重复标签起两个一模一样的 job
            dup=0
            for c in ${CLEAN+"${CLEAN[@]}"}; do [[ "$c" == "$L" ]] && dup=1 && break; done
            (( dup )) || CLEAN+=("$L")
            echo "  ✅ $L"
          done

          if (( ${#CLEAN[@]} == 0 )); then
            echo "::error::runner_labels 为空"
            exit 1
          fi

          # 拼 JSON 数组。标签已过白名单校验，不含引号或反斜杠，拼接是安全的
          JSON="["
          for i in "${!CLEAN[@]}"; do
            (( i > 0 )) && JSON+=","
            JSON+="\"${CLEAN[$i]}\""
          done
          JSON+="]"

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=${#CLEAN[@]}" >> "$GITHUB_OUTPUT"
          echo "矩阵: $JSON  (${#CLEAN[@]} 个平台)"

      - name: 🔢 校验数值参数
        shell: bash
        run: |
          set -uo pipefail
          set +e   # GitHub 给 shell: bash 注入了 -e -o pipefail，探测步骤必须容忍缺工具与非零退出，否则整步会被杀掉
          fail() { echo "::error::$1"; exit 1; }

          [[ "$IN_SECONDS" =~ ^[0-9]+$ ]] || fail "bench_seconds 必须是正整数，收到 '$IN_SECONDS'"
          (( IN_SECONDS >= 1 && IN_SECONDS <= 60 )) || fail "bench_seconds 需在 1~60，收到 '$IN_SECONDS'"

          [[ "$IN_DISK_MB" =~ ^[0-9]+$ ]] || fail "disk_mb 必须是正整数，收到 '$IN_DISK_MB'"
          (( IN_DISK_MB >= 64 && IN_DISK_MB <= 8192 )) || fail "disk_mb 需在 64~8192（runner 只有 14GB 盘），收到 '$IN_DISK_MB'"

          [[ "$IN_WORKERS" =~ ^[0-9]+$ ]] || fail "bench_workers 必须是整数（0=全部逻辑核），收到 '$IN_WORKERS'"
          (( IN_WORKERS <= 64 )) || fail "bench_workers 上限 64，收到 '$IN_WORKERS'"

          echo "✅ seconds=$IN_SECONDS disk_mb=$IN_DISK_MB workers=$IN_WORKERS"

      - name: 💡 提示
        shell: bash
        run: |
          cat <<'EOF'
          探测矩阵即将启动。请注意这些既知差异，否则会误读结果：
            - ubuntu-latest  = 4 vCPU / 16 GB / x64 VM
            - ubuntu-slim    = 1 vCPU /  5 GB / x64 容器，job 超时 15 分钟，不支持 Docker-in-Docker
            - windows-latest = 4 vCPU / 16 GB / x64 VM
            - macos-latest   = 3 vCPU (M1) / 7 GB / arm64 —— 核数与内存都比另两个平台少
            - 所有标准 runner 均无 GPU
            - 公开仓库分钟数免费；私有仓库按分钟计费，macOS 费率为 Linux 的 10 倍
          托管 runner 是共享物理机上的 VM，同标签两次运行的波动可达 ±30%，单次结果只宜定性比较。
          EOF

  probe:
    name: "🔍 ${{ matrix.os }}"
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # 某个平台挂了也要让其余平台跑完，否则拿不到对比数据
      fail-fast: false
      max-parallel: 6
      matrix:
        # 由 validate job 用 bash 生成 JSON 数组后传入。
        # 不能用表达式拆 CSV —— GitHub Actions 既没有 replace() 也没有任何字符串切分函数
        os: ${{ fromJson(needs.validate.outputs.matrix) }}
    env:
      # 统一固定 Python 版本，是三个平台基准可横向比较的前提
      PY_VERSION: '3.12'
      BENCH_SECONDS: ${{ github.event.inputs.bench_seconds || '3' }}
      BENCH_DISK_MB: ${{ github.event.inputs.disk_mb || '1024' }}
      BENCH_WORKERS: ${{ github.event.inputs.bench_workers || '0' }}
      BENCH_NET: ${{ github.event.inputs.probe_net || 'true' }}
      BENCH_NATIVE: ${{ github.event.inputs.native_bench || 'true' }}
      UPLOAD_ARTIFACTS: ${{ github.event.inputs.upload_artifacts || 'true' }}
      # 注意：PROBE_DIR 不能写在这里 —— runner 上下文在 job 级 env 不可用。
      # 改由「初始化探测目录」step 写进 ${GITHUB_ENV}，后续每个 step 自动继承
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: 🐍 固定 Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: 🗂️ 初始化探测目录
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -uo pipefail
          set +e   # GitHub 给 shell: bash 注入了 -e -o pipefail，探测步骤必须容忍缺工具与非零退出，否则整步会被杀掉
          # RUNNER_TEMP 是 runner 注入的真实环境变量，用它而不是 ${{ runner.temp }}
          echo "PROBE_DIR=$RUNNER_TEMP/probe" >> "$GITHUB_ENV"
          PROBE_DIR="$RUNNER_TEMP/probe"
          mkdir -p "$PROBE_DIR"
          echo "PROBE_DIR=$PROBE_DIR"
          python -V 2>&1 || python3 -V 2>&1 || true

          cat > "$PROBE_DIR/00-header.md" <<EOF
          # 🖥️ 硬件 / 性能 / 软件环境探测报告

          | 项 | 值 |
          |---|---|
          | Runner 标签 | \`$MATRIX_OS\` |
          | runner.os / runner.arch | \`$RUNNER_OS\` / \`$RUNNER_ARCH\` |
          | 触发事件 | \`${{ github.event_name }}\` |
          | 提交 | \`${{ github.sha }}\` |
          | 运行时刻 (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |

          > 本报告由 \`.github/workflows/hw-probe.yml\` 自动生成。所有数值均为**实测**，
          > 采集不到的项一律标 \`n/a\`，不做推测填充。
          EOF

          cat "$PROBE_DIR/00-header.md"

      - name: 🧠 探测 CPU 配置（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          set +e   # GitHub 给 shell: bash 注入了 -e -o pipefail，探测步骤必须容忍缺工具与非零退出，否则整步会被杀掉
          RUNNER_OS="${RUNNER_OS:-Linux}"
          F="$PROBE_DIR/01-cpu.md"
          printf '%s\n' '## 🧠 CPU 配置' > "$F"
          emit(){ printf '%s\n' "$@" >> "$F"; }

          ARCH_M="$(uname -m 2>/dev/null || echo unknown)"
          LONG_BIT="$(getconf LONG_BIT 2>/dev/null || echo n/a)"
          case "$ARCH_M" in
            x86_64|amd64)  ARCH_LABEL="x64" ;;
            aarch64|arm64) ARCH_LABEL="arm64" ;;
            *)             ARCH_LABEL="$ARCH_M" ;;
          esac

          emit ""
          emit "### 架构判定（公共）"
          emit ""
          emit "| 项 | 值 |"
          emit "|---|---|"
          emit "| uname -m | \`$ARCH_M\` |"
          emit "| getconf LONG_BIT | \`$LONG_BIT\` |"
          emit "| **架构结论** | **$ARCH_LABEL** |"
          emit ""
          emit "> **架构 = $ARCH_LABEL**（供后续报告使用）"

          if [ "$RUNNER_OS" = "macOS" ]; then
            emit ""
            emit "### macOS：sysctl CPU 信息"
            emit ""
            emit "| 键 | 值 |"
            emit "|---|---|"
            for k in machdep.cpu.brand_string hw.model hw.ncpu hw.physicalcpu hw.logicalcpu \
                     hw.cpufamily hw.cputype hw.cpufrequency hw.cpufrequency_max hw.tbfrequency \
                     hw.optional.arm64 hw.optional.neon; do
              v="$(sysctl -n "$k" 2>/dev/null || true)"
              [ -n "$v" ] || v="n/a"
              v="$(printf '%s' "$v" | tr '|' '/')"
              emit "| \`$k\` | $v |"
            done

            if v="$(sysctl -n machdep.cpu.features 2>/dev/null)" && [ -n "$v" ]; then
              emit ""
              emit "### machdep.cpu.features（Intel）"
              emit '```text'
              printf '%s\n' "$v" >> "$F"
              emit '```'
              if v7="$(sysctl -n machdep.cpu.leaf7_features 2>/dev/null)" && [ -n "$v7" ]; then
                emit ""
                emit "### machdep.cpu.leaf7_features（Intel）"
                emit '```text'
                printf '%s\n' "$v7" >> "$F"
                emit '```'
              fi
            else
              emit ""
              emit "### Apple Silicon：hw.optional 指令集"
              emit '```text'
              sysctl -a 2>/dev/null | grep '^hw.optional' >> "$F" || true
              emit '```'
            fi

            emit ""
            emit "### 缓存大小"
            emit ""
            emit "| 键 | 值 |"
            emit "|---|---|"
            for k in hw.l1icachesize hw.l1dcachesize hw.l2cachesize hw.l3cachesize; do
              v="$(sysctl -n "$k" 2>/dev/null || true)"
              [ -n "$v" ] || v="n/a"
              emit "| \`$k\` | $v |"
            done

            if command -v system_profiler >/dev/null 2>&1; then
              emit ""
              emit "### system_profiler：硬件与处理器（该命令较慢，耐心等待）"
              emit '```text'
              system_profiler SPHardwareDataType SPProcessorsDataType >> "$F" 2>&1 || true
              emit '```'
            else
              emit "- \`system_profiler\`：未安装"
            fi

            emit ""
            emit "### 负载（macOS）"
            emit '```text'
            uptime >> "$F" 2>&1 || true
            sysctl vm.loadavg >> "$F" 2>&1 || true
            emit '```'
          else
            emit ""
            emit "### Linux：核心与型号"
            emit ""
            emit "| 项 | 值 |"
            emit "|---|---|"
            if command -v nproc >/dev/null 2>&1; then
              emit "| nproc（逻辑核数） | $(nproc 2>/dev/null || echo n/a) |"
            else
              emit "| \`nproc\` | 未安装 |"
            fi
            if [ -r /proc/cpuinfo ]; then
              NPROC_CNT="$(grep -c ^processor /proc/cpuinfo 2>/dev/null)"
              NPROC_CNT="${NPROC_CNT:-n/a}"
              emit "| /proc/cpuinfo processor 条目数 | $NPROC_CNT |"
              MODEL="$(grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | sed 's/^[[:space:]]*//' || true)"
              [ -n "$MODEL" ] || MODEL="n/a（本架构 /proc/cpuinfo 无 model name 字段）"
              emit "| model name | $MODEL |"
              MHZ="$(grep -m1 'cpu MHz' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | sed 's/^[[:space:]]*//' || true)"
              [ -n "$MHZ" ] || MHZ="n/a"
              emit "| cpu MHz | $MHZ |"
            else
              emit "| /proc/cpuinfo | 不可读 |"
            fi

            if command -v lscpu >/dev/null 2>&1; then
              emit ""
              emit "### lscpu 全文"
              emit '```text'
              lscpu >> "$F" 2>&1 || true
              emit '```'
              emit ""
              emit "### CPU 拓扑（lscpu -p=CPU,SOCKET,CORE，前 8 行）"
              emit '```text'
              lscpu -p=CPU,SOCKET,CORE 2>/dev/null | grep -v '^#' | head -n 8 >> "$F" || true
              emit '```'
            else
              emit "- \`lscpu\`：未安装"
            fi

            FLAGS_LINE="$(grep -m1 '^flags' /proc/cpuinfo 2>/dev/null || true)"
            if [ -n "$FLAGS_LINE" ]; then
              FLAGS_BODY="$(printf '%s' "$FLAGS_LINE" | cut -d: -f2-)"
              FLAG_CNT="$(printf '%s' "$FLAGS_BODY" | tr ' ' '\n' | sed '/^$/d' | wc -l | tr -d ' ')"
              emit ""
              emit "### 指令集（x86 flags）"
              emit ""
              emit "- CPU flags 总数：$FLAG_CNT"
              emit ""
              emit "| 指令集 | 是否支持 |"
              emit "|---|---|"
              for ins in avx512f avx2 avx sse4_2 aes bmi2 sha_ni; do
                if printf '%s' "$FLAGS_BODY" | tr ' ' '\n' | grep -qx "$ins"; then
                  emit "| $ins | 支持 |"
                else
                  emit "| $ins | 不支持 |"
                fi
              done
            else
              emit "- CPU flags：n/a（非 x86 架构，/proc/cpuinfo 无 flags 行）"
            fi

            emit ""
            emit "### NUMA"
            if command -v numactl >/dev/null 2>&1; then
              emit '```text'
              numactl --hardware >> "$F" 2>&1 || true
              emit '```'
            elif [ -d /sys/devices/system/node ]; then
              NODE_CNT="$(ls /sys/devices/system/node 2>/dev/null | grep -c '^node[0-9]')"
              NODE_CNT="${NODE_CNT:-0}"
              emit "- NUMA node 数量（/sys/devices/system/node/ 计数）：$NODE_CNT"
            else
              emit "- NUMA：n/a（无 numactl 且无 /sys/devices/system/node/）"
            fi

            emit ""
            emit "### cgroup CPU 限制（识别容器型 runner，如 ubuntu-slim）"
            if [ -r /sys/fs/cgroup/cpu.max ]; then
              CG_V2="$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || true)"
              CGQ="$(printf '%s' "$CG_V2" | awk '{print $1}')"
              CGP="$(printf '%s' "$CG_V2" | awk '{print $2}')"
              emit "- cgroup v2 \`cpu.max\`：\`$CGQ $CGP\`"
              if [ "$CGQ" = "max" ] || [ -z "$CGQ" ]; then
                emit "- 等效核数：无限制"
              else
                emit "- 等效核数：$(awk -v q="$CGQ" -v p="$CGP" 'BEGIN{ if (p+0>0) printf "%.2f", q/p; else print "n/a" }')"
              fi
            elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
              Q="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us 2>/dev/null || echo 0)"
              P="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us 2>/dev/null || echo 0)"
              emit "- cgroup v1 \`cpu.cfs_quota_us\`：\`$Q\`；\`cpu.cfs_period_us\`：\`$P\`"
              emit "- 等效核数：$(awk -v q="$Q" -v p="$P" 'BEGIN{ if (q+0>0 && p+0>0) printf "%.2f", q/p; else print "无限制或 n/a" }')"
            else
              emit "- 未检测到 cgroup CPU 限制文件（非容器环境或不可读）"
            fi

            emit ""
            emit "### CPU 频率（cpufreq）"
            for kf in cpuinfo_max_freq scaling_governor; do
              kp="/sys/devices/system/cpu/cpu0/cpufreq/$kf"
              if [ -r "$kp" ]; then
                emit "- ${kf}：\`$(cat "$kp" 2>/dev/null || echo n/a)\`"
              else
                emit "- ${kf}：n/a（云环境通常不存在 cpufreq）"
              fi
            done

            emit ""
            emit "### 负载（Linux）"
            emit '```text'
            cat /proc/loadavg >> "$F" 2>/dev/null || emit "( /proc/loadavg 不可读 )"
            if command -v uptime >/dev/null 2>&1; then
              uptime >> "$F" 2>&1 || true
            else
              emit "( uptime：未安装 )"
            fi
            emit '```'
          fi

          echo ""
          ls -la "$PROBE_DIR"
      - name: 💾 探测内存配置（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          set +e   # GitHub 给 shell: bash 注入了 -e -o pipefail，探测步骤必须容忍缺工具与非零退出，否则整步会被杀掉
          RUNNER_OS="${RUNNER_OS:-Linux}"
          F="$PROBE_DIR/02-memory.md"
          printf '%s\n' '## 💾 内存配置' > "$F"
          emit(){ printf '%s\n' "$@" >> "$F"; }

          emit ""
          emit "### 页大小（公共）"
          if command -v python3 >/dev/null 2>&1; then
            PS_PY="$(python3 -c "import os;print(os.sysconf('SC_PAGE_SIZE'))" 2>/dev/null || true)"
            [ -n "$PS_PY" ] || PS_PY="n/a"
            emit "- \`os.sysconf('SC_PAGE_SIZE')\`：\`$PS_PY\` 字节"
          else
            emit "- \`python3\`：未安装"
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            emit ""
            emit "### macOS：物理内存"
            emit ""
            emit "| 键 | 值 |"
            emit "|---|---|"
            MEMSIZE="$(sysctl -n hw.memsize 2>/dev/null || true)"
            if [ -n "$MEMSIZE" ]; then
              emit "| hw.memsize | $MEMSIZE 字节（$(awk -v b="$MEMSIZE" 'BEGIN{printf "%.2f GB", b/1073741824}')） |"
            else
              emit "| hw.memsize | n/a |"
            fi
            MEMU="$(sysctl -n hw.memsize_usable 2>/dev/null || true)"
            if [ -n "$MEMU" ]; then
              emit "| hw.memsize_usable | $MEMU 字节（$(awk -v b="$MEMU" 'BEGIN{printf "%.2f GB", b/1073741824}')） |"
            else
              emit "| hw.memsize_usable | n/a（该键可能不存在） |"
            fi
            for k in vm.compressor_mode hw.usermem; do
              v="$(sysctl -n "$k" 2>/dev/null || true)"
              [ -n "$v" ] || v="n/a"
              emit "| $k | $v |"
            done
            v="$(sysctl -n vm.swapusage 2>/dev/null || true)"
            [ -n "$v" ] || v="n/a"
            emit "| vm.swapusage | $v |"

            emit ""
            emit "### vm_stat 全文"
            emit '```text'
            vm_stat >> "$F" 2>&1 || true
            emit '```'

            PGSZ="$(sysctl -n hw.pagesize 2>/dev/null || echo 0)"
            emit ""
            emit "### vm_stat 换算（页大小 = $PGSZ 字节）"
            emit ""
            emit "| 类别 | 页数 | MB |"
            emit "|---|---|---|"
            vm_stat 2>/dev/null | awk -v ps="$PGSZ" '
              {
                line = $0
                sub(/\.$/, "", line)
                i = index(line, ":")
                if (i > 1) {
                  name = substr(line, 1, i-1)
                  val = substr(line, i+1)
                  gsub(/ /, "", val)
                  gsub(/\|/, "/", name)
                  if (val ~ /^[0-9]+$/ && ps+0 > 0)
                    printf "| %s | %s | %.1f |\n", name, val, val*ps/1048576
                }
              }' >> "$F" || true

            emit ""
            emit "### memory_pressure（前 20 行）"
            if command -v memory_pressure >/dev/null 2>&1; then
              emit '```text'
              memory_pressure 2>/dev/null | head -n 20 >> "$F" || true
              emit '```'
            else
              emit "- \`memory_pressure\`：未安装"
            fi
          else
            emit ""
            emit "### Linux：free -h"
            if command -v free >/dev/null 2>&1; then
              emit ""
              emit "| 项 | 值 |"
              emit "|---|---|"
              free -h 2>/dev/null | awk 'NR==2{
                av = "n/a"
                if (NF >= 7) av = $7
                printf "| total | %s |\n| used | %s |\n| free | %s |\n| available | %s |\n", $2, $3, $4, av
              }' >> "$F" || true
              emit ""
              emit "### free -h 原始输出"
              emit '```text'
              free -h >> "$F" 2>&1 || true
              emit '```'
            else
              emit "- \`free\`：未安装"
            fi

            if [ -r /proc/meminfo ]; then
              emit ""
              emit "### /proc/meminfo（前 40 行）"
              emit '```text'
              head -n 40 /proc/meminfo >> "$F" 2>&1 || true
              emit '```'
              emit ""
              emit "### HugePages"
              emit '```text'
              grep -i huge /proc/meminfo >> "$F" 2>&1 || emit "( 无 HugePages 相关条目 )"
              emit '```'
              AVAIL_GB="$(awk '/MemAvailable/{printf "%.2f", $2/1024/1024}' /proc/meminfo 2>/dev/null || true)"
              [ -n "$AVAIL_GB" ] || AVAIL_GB="n/a"
              emit "- 实测可用内存（MemAvailable）：**$AVAIL_GB GB**"
            else
              emit "- /proc/meminfo：不可读"
            fi

            emit ""
            emit "### cgroup 内存上限"
            if [ -r /sys/fs/cgroup/memory.max ]; then
              MV="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || true)"
              if [ "$MV" = "max" ] || [ -z "$MV" ]; then
                emit "- cgroup v2 \`memory.max\`：\`max\`（无限制）"
              else
                emit "- cgroup v2 \`memory.max\`：\`$MV\` 字节 = $(awk -v b="$MV" 'BEGIN{printf "%.2f GB", b/1073741824}')"
              fi
            elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
              MV="$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || true)"
              emit "- cgroup v1 \`memory.limit_in_bytes\`：\`$MV\` 字节 = $(awk -v b="$MV" 'BEGIN{ if (b+0>0 && b<1099511627776) printf "%.2f GB", b/1073741824; else print "无限制或 n/a" }')"
            else
              emit "- 未检测到 cgroup 内存限制文件（非容器环境或不可读）"
            fi

            emit ""
            emit "### Swap"
            emit '```text'
            if command -v swapon >/dev/null 2>&1; then
              swapon --show >> "$F" 2>&1 || true
            else
              emit "( swapon：未安装 )"
            fi
            cat /proc/swaps >> "$F" 2>/dev/null || emit "( /proc/swaps 不可读 )"
            emit '```'
          fi

          echo ""
          ls -la "$PROBE_DIR"
      - name: 🗄️ 探测磁盘存储（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          set +e   # GitHub 给 shell: bash 注入了 -e -o pipefail，探测步骤必须容忍缺工具与非零退出，否则整步会被杀掉
          RUNNER_OS="${RUNNER_OS:-Linux}"
          F="$PROBE_DIR/03-disk.md"
          printf '%s\n' '## 🗄️ 磁盘 / 存储' > "$F"
          emit(){ printf '%s\n' "$@" >> "$F"; }
          FSTYPE=""
          DU_INFO=""
          SP_STORAGE=""

          if [ "$RUNNER_OS" = "macOS" ]; then
            emit ""
            emit "### macOS：df -h"
            emit '```text'
            df -h >> "$F" 2>&1 || true
            emit '```'

            if command -v diskutil >/dev/null 2>&1; then
              emit ""
              emit "### diskutil list"
              emit '```text'
              diskutil list >> "$F" 2>&1 || true
              emit '```'
              DU_INFO="$(diskutil info / 2>/dev/null || true)"
              emit ""
              emit "### diskutil info /（含 File System Personality / Protocol / Device / Media Name）"
              emit '```text'
              printf '%s\n' "$DU_INFO" >> "$F"
              emit '```'
            else
              emit "- \`diskutil\`：未安装"
            fi

            if command -v system_profiler >/dev/null 2>&1; then
              emit ""
              emit "### system_profiler：NVMe 与存储（该命令较慢）"
              SP_STORAGE="$(system_profiler SPNVMeDataType SPStorageDataType 2>/dev/null || true)"
              emit '```text'
              printf '%s\n' "$SP_STORAGE" >> "$F"
              emit '```'
            else
              emit "- \`system_profiler\`：未安装"
            fi

            emit ""
            emit "### mount（macOS）"
            emit '```text'
            mount >> "$F" 2>&1 || true
            emit '```'
            FSTYPE="$(mount 2>/dev/null | awk '$3=="/"{print $5; exit}')"
          else
            emit ""
            emit "### Linux：df -h（全部）"
            emit '```text'
            df -h >> "$F" 2>&1 || true
            emit '```'
            emit ""
            emit "### df -i（inode）"
            emit '```text'
            df -i >> "$F" 2>&1 || true
            emit '```'

            emit ""
            emit "### 与 / 、/mnt 、/home 、当前工作目录相关的挂载"
            emit '```text'
            mount 2>/dev/null | grep -E " on (/|/mnt|/home|/tmp) " >> "$F" || true
            mount 2>/dev/null | grep -F " on $(pwd) " >> "$F" || true
            emit '```'

            if command -v lsblk >/dev/null 2>&1; then
              emit ""
              emit "### lsblk（ROTA=0 表示非旋转设备即 SSD，ROTA=1 为机械盘）"
              emit '```text'
              lsblk -o NAME,SIZE,TYPE,ROTA,MODEL,MOUNTPOINT >> "$F" 2>&1 || true
              emit '```'
              emit ""
              emit "### lsblk discard 特性（SSD TRIM 能力，DISC-*）"
              emit '```text'
              if lsblk -d -o NAME,DISC-ALGN,DISC-GRAN,DISC-MAX >/dev/null 2>&1; then
                lsblk -d -o NAME,DISC-ALGN,DISC-GRAN,DISC-MAX >> "$F" 2>&1 || true
              else
                lsblk -d >> "$F" 2>&1 || true
                emit "( 当前 lsblk 版本不支持 DISC-* 列 )"
              fi
              emit '```'
            else
              emit "- \`lsblk\`：未安装"
            fi

            emit ""
            emit "### 块设备队列参数"
            emit ""
            emit "| 设备 | rotational | scheduler |"
            emit "|---|---|---|"
            if [ -d /sys/block ]; then
              for d in /sys/block/*/; do
                [ -d "$d" ] || continue
                n="$(basename "$d")"
                rot="n/a"
                sch="n/a"
                [ -r "$d/queue/rotational" ] && rot="$(cat "$d/queue/rotational" 2>/dev/null)"
                [ -r "$d/queue/scheduler" ] && sch="$(cat "$d/queue/scheduler" 2>/dev/null | tr '|' '/')"
                emit "| $n | $rot | $sch |"
              done
            else
              emit "| （n/a） | /sys/block 不存在 | n/a |"
            fi

            emit ""
            emit "### NVMe 设备"
            if command -v nvme >/dev/null 2>&1; then
              emit '```text'
              nvme list >> "$F" 2>&1 || true
              emit '```'
            else
              emit "- \`nvme\`：未安装，改列 \`/dev/disk/by-id/\`："
              emit '```text'
              ls -l /dev/disk/by-id/ >> "$F" 2>/dev/null || emit "( /dev/disk/by-id/ 不存在 )"
              emit '```'
            fi

            if command -v findmnt >/dev/null 2>&1; then
              FSTYPE="$(findmnt -no FSTYPE -T "$PROBE_DIR" 2>/dev/null || true)"
            else
              emit "- \`findmnt\`：未安装"
            fi
          fi

          emit ""
          emit "### 关键结论"
          emit ""
          DF_LINE="$(df -h "$PROBE_DIR" 2>/dev/null | awk 'NR==2' || true)"
          DF_DEV="$(printf '%s\n' "$DF_LINE" | awk '{print $1}')"
          DF_TOTAL="$(printf '%s\n' "$DF_LINE" | awk '{print $2}')"
          DF_AVAIL="$(printf '%s\n' "$DF_LINE" | awk '{print $4}')"
          DF_MNT="$(printf '%s\n' "$DF_LINE" | awk '{print $NF}')"
          [ -n "$DF_DEV" ] || DF_DEV="n/a"
          [ -n "$DF_TOTAL" ] || DF_TOTAL="n/a"
          [ -n "$DF_AVAIL" ] || DF_AVAIL="n/a"
          [ -n "$DF_MNT" ] || DF_MNT="n/a"
          [ -n "$FSTYPE" ] || FSTYPE="n/a"

          SSD_FLAG="n/a"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if printf '%s\n%s\n' "$DU_INFO" "$SP_STORAGE" | grep -qiE 'solid state|medium type.*ssd|protocol.*(nvme|apple fabric)'; then
              SSD_FLAG="是（SSD）"
            fi
          else
            if [ "$DF_DEV" != "n/a" ] && command -v lsblk >/dev/null 2>&1; then
              PK="$(lsblk -no PKNAME "$DF_DEV" 2>/dev/null || true)"
              [ -n "$PK" ] || PK="$(basename "$DF_DEV" 2>/dev/null || true)"
              if [ -n "$PK" ] && [ -r "/sys/block/$PK/queue/rotational" ]; then
                if [ "$(cat "/sys/block/$PK/queue/rotational" 2>/dev/null)" = "0" ]; then
                  SSD_FLAG="是（SSD，rotational=0）"
                else
                  SSD_FLAG="否（rotational=1，机械盘）"
                fi
              fi
            fi
          fi

          NET_FLAG="n/a"
          case "$FSTYPE" in
            nfs*|cifs|smbfs|afpfs|sshfs|9p|lustre|gpfs|wekafs|osxfuse*) NET_FLAG="是" ;;
            *overlay*|*aufs*) NET_FLAG="否（容器本地覆盖层）" ;;
            n/a) NET_FLAG="n/a" ;;
            *) NET_FLAG="否" ;;
          esac

          emit "| 项 | 值 |"
          emit "|---|---|"
          emit "| \`$PROBE_DIR\` 所在挂载点 | \`$DF_MNT\` |"
          emit "| 文件系统类型 | \`$FSTYPE\` |"
          emit "| 总容量 | $DF_TOTAL |"
          emit "| 可用容量 | $DF_AVAIL |"
          emit "| 是否 SSD | $SSD_FLAG |"
          emit "| 是否网络挂载 | $NET_FLAG |"
          emit ""
          emit "> 对照：GitHub 标准托管 runner 的既知规格为 **14 GB SSD**（本地工作磁盘）。"
          emit "> 若上表可用容量显著偏离该值，说明是特殊机型 / larger runner / self-hosted runner。"

          echo ""
          ls -la "$PROBE_DIR"
      - name: 🎮 探测 GPU / 加速器（Linux / macOS）
        if: runner.os != 'Windows'
