              emit "- \`lspci\`：未安装"
            fi

            emit ""
            emit "### DRI 设备节点（/dev/dri）"
            if [ -e /dev/dri ]; then
              emit '```text'
              ls -l /dev/dri >> "$F" 2>&1 || true
              emit '```'
            else
              emit "- \`/dev/dri\` 不存在（无 DRI 设备节点）"
            fi

            emit ""
            emit "### NVIDIA"
            if command -v nvidia-smi >/dev/null 2>&1; then
              emit '```text'
              nvidia-smi >> "$F" 2>&1 || true
              emit '```'
              GPU_DESC="检测到 NVIDIA GPU：$(nvidia-smi -L 2>/dev/null | head -n 1 || echo 'nvidia-smi 可用')"
            else
              emit "- \`nvidia-smi\`：未安装（无 NVIDIA GPU / 驱动）"
            fi
            if [ -r /proc/driver/nvidia/version ]; then
              emit "- /proc/driver/nvidia/version 内容："
