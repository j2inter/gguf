          if [ "$RUNNER_OS" = "macOS" ]; then
            emit ""
            emit "### macOS：图形处理器（system_profiler SPDisplaysDataType）"
            CHIP=""
            if command -v system_profiler >/dev/null 2>&1; then
              SP_DISP="$(system_profiler SPDisplaysDataType 2>/dev/null || true)"
              emit '```text'
