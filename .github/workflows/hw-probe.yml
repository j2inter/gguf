            if [ "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" = "1" ]; then
              emit "- \`hw.optional.arm64 = 1\`：本机为 **Apple Silicon**，使用 SoC 集成 GPU（Metal 可用）"
              GPU_DESC="检测到 Apple Silicon 集成 GPU${CHIP:+（${CHIP}）}，可用 Metal，但无独立显卡、无 CUDA"
            elif [ -n "$CHIP" ]; then
