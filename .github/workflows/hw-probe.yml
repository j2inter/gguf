              if [ -n "$LSMOD_GPU" ]; then
                emit '```text'
                printf '%s\n' "$LSMOD_GPU" >> "$F"
                emit '```'
              else
                emit "- 未检测到 nvidia / nouveau / amdgpu / i915 相关内核模块"
              fi
            else
              emit "- \`lsmod\`：未安装或不可读"
            fi

            emit ""
            emit "### OpenGL / Vulkan"
            if command -v glxinfo >/dev/null 2>&1; then
              emit '```text'
              glxinfo -B >> "$F" 2>&1 || true
              emit '```'
            elif command -v vulkaninfo >/dev/null 2>&1; then
              emit '```text'
              vulkaninfo --summary >> "$F" 2>&1 || true
              emit '```'
