name: "🚀 Universal Extreme Pro: GGUF & 7z Relay (Hybrid Upload)"

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '目標大文件下載地址'
        required: true
      file_type:
        description: '文件類型與切割策略'
        required: true
        type: choice
        options:
          - gguf   # 使用 split 進行 GGUF 規範化後綴切割
          - other  # 使用 7z 僅存儲模式分卷
      chunk_size_mb:
        description: '分卷大小(MB) [超過 2500MB 將自動改為上傳至 Artifacts]'
        required: true
        default: '2000'

jobs:
  universal-relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🖥️ [1/9] 初始硬件環境與內核深度掃描
        run: |
          echo "==== [SYSTEM INFO START] ===="
          echo "🐧 操作系統內核: $(uname -a)"
          echo "🧠 CPU 核心數: $(nproc) 核心"
          echo "📊 初始物理內存狀態:"
          free -h
          echo "💽 初始硬盤分區狀態:"
          df -Th
          echo "==== [SYSTEM INFO END] ===="

      - name: 🔍 [2/9] 物理空間嗅探與動態裁決
        id: precheck
        run: |
          URL="${{ github.event.inputs.model_url }}"
          FREE_SPACE_MB=$(df -m . | awk 'NR==2 {print $4}')
          SIZE=$(curl -sIL "$URL" | grep -i -E "^Content-Length:" | tail -n 1 | awk '{print $2}' | tr -d '\r')
          
          if [ -z "$SIZE" ] || ! [[ "$SIZE" =~ ^[0-9]+$ ]]; then
            echo "need_clean=true" >> $GITHUB_OUTPUT
          else
            SIZE_MB=$((SIZE / 1024 / 1024))
            REQUIRED_MB=$(( SIZE_MB * 2 + 1024 ))
            if [ "$REQUIRED_MB" -gt "$FREE_SPACE_MB" ]; then
              echo "need_clean=true" >> $GITHUB_OUTPUT
            else
              echo "need_clean=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 🧹 [3/9] 動態釋放磁盤空間 (按需執行)
        if: steps.precheck.outputs.need_clean == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true

      - name: 🛠️ [4/9] 系統依賴與工具鏈部署
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full

      - name: 🌐 [5/9] 遠端鏈接解析與元數據註入
        run: |
          URL="${{ github.event.inputs.model_url }}"
          RAW_NAME=$(basename "${URL%%\?*}")
          [ -z "$RAW_NAME" ] || [ "$RAW_NAME" = "/" ] && RAW_NAME="payload_$(date +%s).bin"
          
          SAFE_BASE_NAME="${RAW_NAME%.*}"
          SAFE_BASE_NAME="${SAFE_BASE_NAME// /-}"
          
          echo "RAW_NAME=$RAW_NAME" >> $GITHUB_ENV
          echo "BASE_NAME=$SAFE_BASE_NAME" >> $GITHUB_ENV
          echo "CST_TIME=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: ⬇️ [6/9] Aria2 激進並發下載
        run: |
          aria2c -x 16 -s 16 -k 1M --console-log-level=notice --file-allocation=none "${{ github.event.inputs.model_url }}" -o "${{ env.RAW_NAME }}"

      - name: 🔪 [7/9] 智能分支切割 (含上傳路徑決策)
        id: splitter
        run: |
          echo "==== [SPLIT ENGINE START] ===="
          RAW="${{ env.RAW_NAME }}"
          BASE="${{ env.BASE_NAME }}"
          TYPE="${{ github.event.inputs.file_type }}"
          INPUT_MB="${{ github.event.inputs.chunk_size_mb }}"
          
          # 判斷上傳目的地：大於 2500MB 則去 Artifacts
          if [ "$INPUT_MB" -gt 2500 ]; then
            echo "MODE=artifacts" >> $GITHUB_ENV
            echo "🚀 檢測到分卷 > 2500MB，目標設定為：Artifacts"
          else
            echo "MODE=release" >> $GITHUB_ENV
            echo "🚀 檢測到分卷 <= 2500MB，目標設定為：GitHub Release"
          fi

          CHUNK_BYTES=$((INPUT_MB * 1024 * 1024))
          FILE_SIZE=$(stat -c%s "$RAW")
          TOTAL=$(( (FILE_SIZE + CHUNK_BYTES - 1) / CHUNK_BYTES ))
          TOTAL_PAD=$(printf "%05d" $TOTAL)
          
          if [ "$TYPE" = "gguf" ]; then
            split -b $CHUNK_BYTES -d -a 5 --numeric-suffixes=1 --additional-suffix="-of-$TOTAL_PAD.gguf" "$RAW" "$BASE-"
          else
            7z a -mx0 -v${CHUNK_BYTES}b "${BASE}.7z" "$RAW"
          fi
          
          rm -f "$RAW"
          echo "✅ 切割完成，產物清單："
          ls -lh "${BASE}"*

      - name: 🚀 [8a/9] 併發上傳至 GitHub Release
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ env.BASE_NAME }}-${{ env.CST_TIME }}-${{ github.event.inputs.file_type }}"
          gh release create "$TAG" --repo "$REPO" --title "Relay [Release]: ${{ env.BASE_NAME }}" --notes "Source: ${{ github.event.inputs.model_url }}"
          
          upload_with_retry() {
            local file=$1; local tag=$2; local repo=$3
            for i in {1..5}; do
              gh release upload "$tag" "$file" --repo "$repo" --clobber && return 0
              sleep $((i * 5))
            done
            return 1
          }
          export -f upload_with_retry
          
          # 併發上傳
          printf "%s\n" "${{ env.BASE_NAME }}"* | xargs -I {} -P 4 bash -c "upload_with_retry '{}' '$TAG' '$REPO'"
          echo "URL_TAG=$TAG" >> $GITHUB_ENV

      - name: 📦 [8b/9] 上傳至 GitHub Artifacts (大文件模式)
        if: env.MODE == 'artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.BASE_NAME }}-${{ env.CST_TIME }}-parts"
          path: "${{ env.BASE_NAME }}*"
          retention-days: 7  # 預設保留 7 天，節省空間

      - name: 🎉 [9/9] 任務竣工報告
        run: |
          echo "==== [MISSION ACCOMPLISHED] ===="
          if [ "${{ env.MODE }}" = "release" ]; then
            echo "✅ 產物已交付至 GitHub Release"
            echo "🔗 連結: https://github.com/${{ github.repository }}/releases/tag/${{ env.URL_TAG }}"
          else
            echo "✅ 產物已交付至 GitHub Artifacts"
            echo "ℹ️ 請前往本 Workflow 運行頁面的 Summary 底部下載。"
          fi
