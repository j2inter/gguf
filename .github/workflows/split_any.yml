name: "🚀 Universal Extreme Pro: GGUF & 7z Relay V2"

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '目标大文件下载地址'
        required: true
      file_type:
        description: '文件类型与切割策略'
        required: true
        type: choice
        options:
          - gguf   # 使用 split 进行 GGUF 规范化后缀切割
          - other  # 使用 7z 仅存储模式分卷
      split_size_mb:
        description: '最大分卷大小 (单位: MB)'
        required: true
        default: '2000' # 默认 2000MB (约2GB)

jobs:
  universal-relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🧹 [1/5] 极限清理磁盘空间 (释放 20GB+ 空间)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 📊 [2/5] 环境检查与工具安装
        run: |
          echo "==== [SYSTEM INFO] ===="
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2 p7zip-full
          echo "✅ 工具安装完成 (aria2, p7zip)。"
          # 打印当前可用空间
          df -h /

      - name: ⚡ [3/5] 智能提取名称与多线程下载
        run: |
          echo "==== [DOWNLOAD START] ===="
          URL="${{ github.event.inputs.model_url }}"
          
          # 【修复】转义 \? 防止通配符吞噬整个字符串
          RAW_NAME=$(basename "${URL%%\?*}")
          
          # 【修复】兜底机制，防止极端 URL 解析为空
          if [ -z "$RAW_NAME" ] || [ "$RAW_NAME" = "/" ]; then
            RAW_NAME="download_$(date +%s).bin"
          fi
          
          BASE_NAME="${RAW_NAME%.*}"
          
          echo "原始完整名: $RAW_NAME"
          echo "纯净前缀名: $BASE_NAME"
          
          # 【修复】使用 EOF 多行安全注入，防止特殊字符破坏 ENV
          echo "RAW_NAME<<EOF" >> $GITHUB_ENV
          echo "$RAW_NAME" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "BASE_NAME<<EOF" >> $GITHUB_ENV
          echo "$BASE_NAME" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "CST_TIME=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          
          aria2c -x 16 -s 16 -k 1M --console-log-level=notice --file-allocation=none \
          "$URL" -o "$RAW_NAME"
          
          echo -e "\n✅ 下载完成:"
          ls -lh "$RAW_NAME"

      - name: 🔪 [4/5] 智能分支切割 (支持自定义MB)
        run: |
          echo "==== [SPLIT START] ===="
          RAW="${{ env.RAW_NAME }}"
          BASE="${{ env.BASE_NAME }}"
          TYPE="${{ github.event.inputs.file_type }}"
          SPLIT_MB="${{ github.event.inputs.split_size_mb }}"
          
          # 【新增】将输入的 MB 转换为精确字节数进行切割计算
          CHUNK_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          FILE_SIZE=$(stat -c%s "$RAW")
          
          TOTAL=$(( (FILE_SIZE + CHUNK_BYTES - 1) / CHUNK_BYTES ))
          TOTAL_PAD=$(printf "%05d" $TOTAL)
          
          echo "检测到策略: [$TYPE] | 文件大小: $FILE_SIZE 字节 | 预设分卷: $SPLIT_MB MB"
          
          if [ "$TYPE" = "gguf" ]; then
            echo "👉 执行 GGUF 标准切割: $RAW -> ${BASE}-XXXXX-of-${TOTAL_PAD}.gguf"
            split -b $CHUNK_BYTES -d -a 5 --numeric-suffixes=1 \
                  --additional-suffix="-of-$TOTAL_PAD.gguf" \
                  "$RAW" "$BASE-"
          else
            echo "👉 执行 7z 仅存储分卷: $RAW -> ${BASE}.7z.001"
            7z a -mx0 -v${CHUNK_BYTES}b "${BASE}.7z" "$RAW"
          fi
          
          # 切割完成后立刻删除原大文件，释放磁盘空间给后续上传留出余地
          rm -f "$RAW"
          echo -e "\n✅ 切割完成，产出清单:"
          ls -lh "${BASE}"*

      - name: 🚢 [5/5] 智能命名上传 (修复并发捕获与空格Tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_NAME: ${{ env.BASE_NAME }}
          CST_TIME: ${{ env.CST_TIME }}
          TYPE: ${{ github.event.inputs.file_type }}
        run: |
          echo "==== [UPLOAD START] ===="
          
          # 【修复】将 BASE_NAME 中的空格替换为连字符，防止 Git Tag 创建报错崩溃
          SAFE_BASE_NAME="${BASE_NAME// /-}"
          TAG="${SAFE_BASE_NAME}-${CST_TIME}-${TYPE}"
          
          gh release create "$TAG" --repo "$REPO" \
            --title "Relay [$TYPE]: $BASE_NAME ($CST_TIME)" \
            --notes "Source: ${{ github.event.inputs.model_url }}
          Split Size: ${{ github.event.inputs.split_size_mb }} MB"

          upload_with_retry() {
            local file=$1
            local tag=$2
            local repo=$3
            local attempt=1
            while [ $attempt -le 5 ]; do
              echo "▶️ [$file] 尝试 $attempt/5"
              if gh release upload "$tag" "$file" --repo "$repo" --clobber; then
                echo "✅ [$file] 成功"
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }
          export -f upload_with_retry
          
          MAX_JOBS=6
          pids=()
          
          for f in "${BASE_NAME}"*; do
            upload_with_retry "$f" "$TAG" "$REPO" &
            pids+=($!)
            
            # 【修复】使用 wait -n 捕获任意一个后台任务的失败并阻断
            if [[ $(jobs -r | wc -l) -ge $MAX_JOBS ]]; then 
              wait -n || exit 1
            fi
          done

          # 【修复】等待并捕获收尾任务的退出状态码
          for pid in "${pids[@]}"; do
            wait $pid || exit 1
          done
          
          echo -e "\n==== [🎉 中转完成] ===="
          echo "链接: https://github.com/$REPO/releases/tag/$TAG"
